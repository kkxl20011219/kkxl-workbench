        : filter === 'undone' ? '全部完成啦，今天很棒！' : '还没有安排，先添加一件小事开始吧', 'sparkles');
      return;
    }
    box.innerHTML = list.map(x => {
      const q = QMAP[x.quad] || QUADS[0];
      const p = K.agg.subProgress(x);
      return `<div class="todo-item ${x.done ? 'done' : ''}" data-id="${x.id}">
        <button class="check ${x.done ? 'on' : ''}" data-check="${x.id}">${icon('check')}</button>
        <div class="ti-body">
          <div class="ti-text">${esc(x.text)}</div>
          <div class="ti-meta">
            <span class="q-dot" style="background:${q.c}"></span>
            <span style="color:${q.ink}">${esc(q.title)}</span>
            ${p.total ? `<span>· 子项 ${p.done}/${p.total}</span>` : ''}
            ${x.done && x.completedAt ? `<span>· ${fmtTime(x.completedAt)} 完成</span>` : ''}
          </div>
        </div>
        <div class="ti-acts">
          <button class="icon-btn ghost tiny" data-edit="${x.id}" title="编辑">${icon('pencil')}</button>
          <button class="icon-btn ghost tiny" data-del="${x.id}" title="删除">${icon('trash')}</button>
        </div>
      </div>`;
    }).join('');
  }

  /* ---------- 四象限 ---------- */
  function paintQuads(host) {
    const s = K.state();
    const grid = $('#quadGrid', host);
    if (!grid) return;
    grid.innerHTML = s.quadOrder.map(key => {
      const q = QMAP[key];
      const items = tasksIn(key);
      const dn = items.filter(x => x.done).length;
      return `<div class="quad" data-quad="${key}"
        style="--qc:${q.c};--qc-bg:${q.bg};--qc-ink:${q.ink};background:linear-gradient(148deg,${q.bg},rgba(255,255,255,.6) 62%)">
        <div class="quad-head">
          <span class="quad-grip" title="拖动调整象限位置">${icon('grip')}</span>
          <span class="quad-badge">${icon(q.icon)}</span>
          <div class="flex1">
            <div class="quad-title">${esc(q.title)}</div>
            <div class="quad-sub">${esc(q.sub)}</div>
          </div>
          <span class="quad-count">${dn}/${items.length}</span>
        </div>
        <div class="quad-body" data-body="${key}">
          ${items.map(taskCard).join('')}
        </div>
        <div class="quad-foot">
          <button class="quad-add" data-qadd="${key}">${icon('plus')}添加到「${esc(q.title)}」</button>
        </div>
      </div>`;
    }).join('');
    initSortables(host);
  }

  function taskCard(x) {
    const q = QMAP[x.quad] || QUADS[0];
    const p = K.agg.subProgress(x);
    const open = !!expanded[x.id];
    const subs = x.subs || [];
    return `<div class="tk ${x.done ? 'done' : ''}" data-id="${x.id}" style="--qc:${q.c}">
      <div class="tk-main">
        <span class="tk-grip" title="拖动移动到其他象限">${icon('grip')}</span>
        <button class="check ${x.done ? 'on' : ''}" data-check="${x.id}" style="width:17px;height:17px;margin-top:1px">${icon('check')}</button>
        <div class="tk-body">
          <div class="tk-text" data-edit-inline="${x.id}" title="点击可编辑">${esc(x.text)}</div>
          ${p.total ? `<div class="tk-sub-meta">
            <span class="tk-progress"><i style="width:${p.pct}%"></i></span>
            <span class="tk-sub-count">${p.done}/${p.total}</span>
          </div>` : ''}
        </div>
        <div class="tk-acts">
          <button class="icon-btn ghost tiny" data-toggle="${x.id}" title="${open ? '收起子项目' : '子项目'}"
            style="${subs.length || open ? '' : 'opacity:.7'}">${icon(open ? 'chevDown' : 'layers')}</button>
          <button class="icon-btn ghost tiny" data-edit="${x.id}" title="编辑">${icon('pencil')}</button>
          <button class="icon-btn ghost tiny" data-del="${x.id}" title="删除">${icon('trash')}</button>
        </div>
      </div>
      <div class="tk-subs ${open ? '' : 'hidden'}">
        ${subs.map(sb => `<div class="sub ${sb.done ? 'done' : ''}" data-sub="${sb.id}">
          <button class="check ${sb.done ? 'on' : ''}" data-subcheck="${x.id}|${sb.id}">${icon('check')}</button>
          <span class="sub-text">${esc(sb.text)}</span>
          ${sb.done && sb.completedAt ? `<span class="sub-time">${fmtTime(sb.completedAt)}</span>` : ''}
          <button class="icon-btn ghost tiny" data-subdel="${x.id}|${sb.id}" title="删除子项">${icon('x')}</button>
        </div>`).join('')}
        <div class="sub-add">
          <input class="input" data-subin="${x.id}" placeholder="添加子项目，回车确认…" maxlength="60">
          <button class="icon-btn tiny" data-subadd="${x.id}" title="添加子项">${icon('plus')}</button>
        </div>
      </div>
    </div>`;
  }

  /* ---------- 拖拽 ---------- */
  function initSortables(host) {
    sortables.forEach(s => { try { s.destroy(); } catch (e) {} });
    sortables = [];
    if (typeof Sortable === 'undefined') return;

    // 象限板块排序
    const grid = $('#quadGrid', host);
    sortables.push(Sortable.create(grid, {
      animation: 240,
      easing: 'cubic-bezier(.22,.61,.36,1)',
      handle: '.quad-grip',
      draggable: '.quad',
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onEnd() {
        K.state().quadOrder = $$('.quad', grid).map(el => el.dataset.quad);
        K.save();
        K.toast('象限顺序已保存', 'grid');
        // 同步下拉选项顺序
        const sel = $('#tdQuad', host);
        if (sel) {
          const cur = sel.value;
          sel.innerHTML = K.state().quadOrder.map(k => `<option value="${k}">${esc(QMAP[k].title)}</option>`).join('');
          sel.value = cur;
        }
        paintTodoList(host);
      },
    }));

    // 事项跨象限拖拽
    $$('.quad-body', host).forEach(body => {
      sortables.push(Sortable.create(body, {
        group: 'kkx-tasks',
        animation: 220,
        easing: 'cubic-bezier(.22,.61,.36,1)',
        handle: '.tk-grip',
        draggable: '.tk',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        onStart() { document.body.style.cursor = 'grabbing'; },
        onAdd(evt) { evt.to.closest('.quad').classList.remove('q-drag-over'); },
        onEnd(evt) {
          document.body.style.cursor = '';
          const s = K.state();
          const order = [];
          $$('.quad-body', host).forEach(b => {
            const q = b.dataset.body;
            $$('.tk', b).forEach(el => {
              const t = findTask(el.dataset.id);
              if (t) { t.quad = q; order.push(t.id); }
            });
          });
          // 重排 state.tasks：非今日任务保持，今日任务按 DOM 顺序
          const t0 = todayStr();
          const others = s.tasks.filter(x => x.date !== t0);
          const map = new Map(s.tasks.filter(x => x.date === t0).map(x => [x.id, x]));
          s.tasks = others.concat(order.map(id => map.get(id)).filter(Boolean));
          K.save();
          paintTodoList(host);
          refreshCounts(host);
          paintQuadStats(host);
          if (evt.from !== evt.to) {
            const q = QMAP[evt.to.dataset.body];
            K.toast(`已移动到「${q.title}」`, q.icon);
          }
        },
      }));
    });
  }

  function refreshCounts(host) {
    $$('.quad', host).forEach(el => {
      const items = tasksIn(el.dataset.quad);
      const c = $('.quad-count', el);
      if (c) c.textContent = `${items.filter(x => x.done).length}/${items.length}`;
    });
  }

  /* ---------- 时间轴 ---------- */
  function paintTimeline(host) {
    const tl = K.agg.timelineOn(todayStr());
    const bar = $('#tlBar', host);
    const list = $('#tlList', host);
    if (!bar || !list) return;

    // 24h 刻度 + 节点
    let inner = [0, 4, 8, 12, 16, 20].map(h => `<span class="hour-line" style="left:${h / 24 * 100}%"></span>`).join('');
    inner += tl.map(n => {
      const d = new Date(n.ts);
      const p = (d.getHours() * 60 + d.getMinutes()) / 1440 * 100;
      const q = QMAP[n.quad] || QUADS[0];
      return `<span class="tl-node" style="left:${p.toFixed(2)}%;--nc:${q.c};background:${q.c}"
        title="${esc(fmtTime(n.ts))} · ${esc(n.title)}"></span>`;
    }).join('');
    // 当前时刻指示
    const now = new Date();
    const np = (now.getHours() * 60 + now.getMinutes()) / 1440 * 100;
    inner += `<span class="hour-line" style="left:${np.toFixed(2)}%;background:var(--lav-600);width:1.6px;opacity:.55"></span>`;
    bar.innerHTML = inner;

    if (!tl.length) {
      list.innerHTML = K.emptyBox('完成一个子项目试试，时间轴会自动记录时刻 ✦', 'clock');
      return;
    }
    list.innerHTML = `<div class="timeline">${tl.slice().reverse().map((n, i) => {
      const q = QMAP[n.quad] || QUADS[0];
      return `<div class="tl-item" style="--tlc:${q.c};animation-delay:${i * 40}ms">
        <div class="tl-time">${fmtTime(n.ts)}</div>
        <div class="tl-card">
          <div class="tl-title">${n.kind === 'task' ? icon('flag') + ' ' : ''}${esc(n.title)}</div>
          <div class="tl-parent">
            <span class="q-dot" style="background:${q.c}"></span>
            ${n.parent ? `来自：${esc(n.parent)}` : `${esc(q.title)} · 主项完成`}
          </div>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  /* ---------- 象限分布 ---------- */
  function paintQuadStats(host) {
    const box = $('#quadStats', host);
    if (!box) return;
    const s = K.state();
    const rows = s.quadOrder.map(k => {
      const q = QMAP[k];
      const items = tasksIn(k);
      const dn = items.filter(x => x.done).length;
      const p = items.length ? Math.round(dn / items.length * 100) : 0;
      return { q, n: items.length, dn, p };
    });
    const max = Math.max(1, ...rows.map(r => r.n));
    box.innerHTML = rows.map(r => `
      <div style="margin-bottom:14px">
        <div class="flex aic jcb" style="margin-bottom:6px">
          <span class="flex aic gap6 fs12 fw6">
            <span class="q-dot" style="background:${r.q.c}"></span>${esc(r.q.title)}
          </span>
          <span class="fs11 fw7 tnum" style="color:${r.q.ink}">${r.dn}/${r.n}${r.n ? ` · ${r.p}%` : ''}</span>
        </div>
        <div class="pbar" style="background:${r.q.bg}">
          <i style="width:${r.n ? Math.round(r.n / max * 100) : 0}%;background:linear-gradient(90deg,${r.q.c},${r.q.c}cc)"></i>
        </div>
      </div>`).join('') +
      `<p class="fs11 faint mt10">${tipText(rows)}</p>`;
  }

  function tipText(rows) {
    const m = rows.reduce((a, b) => (b.n > a.n ? b : a), rows[0]);
    if (!m || !m.n) return '还没有事项，先从一件小事开始 ✦';
    if (m.q.key === 'urgent') return '重要且紧急的事偏多，注意别让自己长期处在救火状态。';
    if (m.q.key === 'cycle') return '周期性计划占比高，说明你在稳定积累，很好 ✦';
    if (m.q.key === 'misc') return '琐事较多，试试把它们集中在固定时段批量处理。';
    return '有留白也很重要，记得给放松留出位置。';
  }

  /* ---------- 交互绑定 ---------- */
  function bind(host) {
    const s = K.state();

    // 添加
    const doAdd = () => {
      const inp = $('#tdInput', host);
      const t = addTask(inp.value, $('#tdQuad', host).value);
      if (!t) { jitter(inp); return; }
      inp.value = '';
      expanded[t.id] = false;
      paintTodoList(host); paintQuads(host); paintQuadStats(host); K.updateBadges();
      K.toast('已添加到' + QMAP[t.quad].title, 'plus');
    };
    $('#tdAdd', host).onclick = doAdd;
    $('#tdInput', host).addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });

    // 筛选
    on($('#tdFilter', host), 'click', 'button', (e, el) => {
      filter = el.dataset.f;
      $$('#tdFilter button', host).forEach(b => b.classList.toggle('on', b === el));
      paintTodoList(host);
    });

    // 象限内快速添加
    on(host, 'click', '[data-qadd]', (e, el) => {
      const key = el.dataset.qadd;
      jitter(el);
      K.openModal({
        title: `添加到「${QMAP[key].title}」`,
        okText: '添加',
        body: `<div class="field"><label>事项内容</label>
                 <input class="input" id="qaIn" placeholder="要做的事…" maxlength="80"></div>
               <div class="field"><label>子项目（可选，每行一个）</label>
                 <textarea class="textarea" id="qaSubs" placeholder="拆解成小步骤&#10;例如：查资料&#10;例如：写初稿" style="min-height:82px"></textarea></div>`,
        onOK(body) {
          const v = $('#qaIn', body).value.trim();
          if (!v) return false;
          const t = addTask(v, key);
          const lines = $('#qaSubs', body).value.split('\n').map(x => x.trim()).filter(Boolean);
          lines.forEach(x => t.subs.push({ id: uid('sb'), text: x, done: false, completedAt: null, createdAt: Date.now() }));
          if (lines.length) expanded[t.id] = true;
          K.save(true);
          paintTodoList(host); paintQuads(host); paintQuadStats(host); K.updateBadges();
          K.toast('已添加' + (lines.length ? `，含 ${lines.length} 个子项目` : ''), 'plus');
        },
      });
    });

    // 主项勾选
    on(host, 'click', '[data-check]', (e, el) => {
      const t = findTask(el.dataset.check);
      if (!t) return;
      t.done = !t.done;
      t.completedAt = t.done ? Date.now() : null;
      (t.subs || []).forEach(sb => {
        if (t.done && !sb.done) { sb.done = true; sb.completedAt = Date.now(); }
        if (!t.done && sb.done) { sb.done = false; sb.completedAt = null; }
      });
      el.classList.toggle('on', t.done);
      if (t.done) el.classList.add('burst');
      K.save();
      paintTodoList(host); paintQuads(host); paintTimeline(host); paintQuadStats(host); K.updateBadges();
      if (t.done) K.toast('完成一件事 ✦');
    });

    // 子项勾选
    on(host, 'click', '[data-subcheck]', (e, el) => {
      const [tid, sid] = el.dataset.subcheck.split('|');
      const t = findTask(tid); if (!t) return;
      const sb = (t.subs || []).find(x => x.id === sid); if (!sb) return;
      sb.done = !sb.done;
      sb.completedAt = sb.done ? Date.now() : null;
      syncTaskBySubs(t);
      el.classList.toggle('on', sb.done);
      if (sb.done) el.classList.add('burst');
      K.save();
      paintQuads(host); paintTodoList(host); paintTimeline(host); paintQuadStats(host); K.updateBadges();
      if (sb.done) K.toast(`子项完成 · 已记入时间轴 ${fmtTime(sb.completedAt)}`, 'clock');
    });

    // 展开/收起子项
    on(host, 'click', '[data-toggle]', (e, el) => {
      const id = el.dataset.toggle;
      expanded[id] = !expanded[id];
      const tk = el.closest('.tk');
      const box = $('.tk-subs', tk);
      box.classList.toggle('hidden', !expanded[id]);
      el.innerHTML = icon(expanded[id] ? 'chevDown' : 'layers');
      if (expanded[id]) { box.classList.add('pop-in'); const i = $('input', box); if (i) i.focus(); }
    });

    // 添加子项
    const addSub = (tid, val, inputEl) => {
      const t = findTask(tid); if (!t) return;
      const v = String(val || '').trim();
      if (!v) { jitter(inputEl); return; }
      t.subs = t.subs || [];
      t.subs.push({ id: uid('sb'), text: v, done: false, completedAt: null, createdAt: Date.now() });
      syncTaskBySubs(t);
      expanded[tid] = true;
      K.save();
      paintQuads(host); paintTodoList(host); paintQuadStats(host);
      const ni = $(`[data-subin="${tid}"]`, host);
      if (ni) ni.focus();
      K.toast('子项目已添加', 'plus');
    };
    on(host, 'click', '[data-subadd]', (e, el) => {
      const tid = el.dataset.subadd;
      addSub(tid, $(`[data-subin="${tid}"]`, host).value, el);
    });
    on(host, 'keydown', '[data-subin]', (e, el) => {
      if (e.key === 'Enter') { e.preventDefault(); addSub(el.dataset.subin, el.value, el); }
    });

    // 删除子项
    on(host, 'click', '[data-subdel]', (e, el) => {
      const [tid, sid] = el.dataset.subdel.split('|');
      const t = findTask(tid); if (!t) return;
      t.subs = (t.subs || []).filter(x => x.id !== sid);
      syncTaskBySubs(t);
      const row = el.closest('.sub');
      row.classList.add('removing');
      K.save();
      setTimeout(() => { paintQuads(host); paintTodoList(host); paintTimeline(host); paintQuadStats(host); }, 300);
    });

    // 编辑（弹窗）
    on(host, 'click', '[data-edit]', (e, el) => openEdit(host, el.dataset.edit));

    // 点击文字行内编辑
    on(host, 'click', '[data-edit-inline]', (e, el) => {
      const id = el.dataset.editInline;
      const t = findTask(id); if (!t || el.querySelector('input')) return;
      const old = t.text;
      el.innerHTML = `<input class="input" value="${esc(old)}" maxlength="80" style="padding:3px 7px;font-size:12.8px;border-radius:6px">`;
      const inp = el.querySelector('input');
      inp.focus(); inp.select();
      const commit = () => {
        const v = inp.value.trim();
        t.text = v || old;
        K.save();
        paintQuads(host); paintTodoList(host); paintTimeline(host);
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
        if (ev.key === 'Escape') { inp.value = old; inp.blur(); }
      });
    });

    // 删除主项
    on(host, 'click', '[data-del]', (e, el) => {
      const t = findTask(el.dataset.del); if (!t) return;
      const nSub = (t.subs || []).length;
      K.confirmBox('删除事项', `确定删除「${t.text}」${nSub ? `及其 ${nSub} 个子项目` : ''}吗？`, () => {
        const s2 = K.state();
        s2.tasks = s2.tasks.filter(x => x.id !== t.id);
        delete expanded[t.id];
        K.save(true);
        paintTodoList(host); paintQuads(host); paintTimeline(host); paintQuadStats(host); K.updateBadges();
        K.toast('已删除', 'trash');
      });
    });

    // 恢复象限默认排序
    $('#quadReset', host).onclick = (e) => {
      K.state().quadOrder = QUADS.map(q => q.key);
      K.save(); jitter(e.currentTarget);
      paintQuads(host); paintTodoList(host); paintQuadStats(host);
      const sel = $('#tdQuad', host);
      if (sel) sel.innerHTML = K.state().quadOrder.map(k => `<option value="${k}">${esc(QMAP[k].title)}</option>`).join('');
      K.toast('已恢复默认排序', 'refresh');
    };

    // 拖拽高亮
    ['dragenter', 'dragover'].forEach(ev =>
      host.addEventListener(ev, e => {
        const q = e.target.closest && e.target.closest('.quad');
        $$('.quad', host).forEach(x => x.classList.toggle('q-drag-over', x === q));
      }, true));
    host.addEventListener('drop', () => $$('.quad', host).forEach(x => x.classList.remove('q-drag-over')), true);
  }

  function openEdit(host, id) {
    const t = findTask(id); if (!t) return;
    const s = K.state();
    K.openModal({
      title: '编辑事项',
      okText: '保存',
      wide: true,
      body: `
        <div class="field"><label>事项内容</label>
          <input class="input" id="edText" value="${esc(t.text)}" maxlength="80"></div>
        <div class="field"><label>所属象限</label>
          <div class="chip-wrap" id="edQuad">
            ${s.quadOrder.map(k => {
              const q = QMAP[k];
              return `<span class="chip ${k === t.quad ? 'on' : ''}" data-q="${k}"
                style="${k === t.quad ? `background:linear-gradient(120deg,${q.c},${q.c}cc);border-color:transparent` : ''}">
                <span class="q-dot" style="background:${k === t.quad ? '#fff' : q.c}"></span>${esc(q.title)}</span>`;
            }).join('')}
          </div></div>
        <div class="field"><label>子项目（每行一个，勾选状态会保留）</label>
          <textarea class="textarea" id="edSubs" placeholder="每行一个子项目">${esc((t.subs || []).map(x => x.text).join('\n'))}</textarea></div>
        <p class="fs11 faint">提示：子项目勾选后会自动记录完成时刻，并出现在下方的完成时间轴上。</p>`,
      onOK(body) {
        const v = $('#edText', body).value.trim();
        if (!v) return false;
        t.text = v;
        const q = $('.chip.on', body);
        if (q) t.quad = q.dataset.q;
        const lines = $('#edSubs', body).value.split('\n').map(x => x.trim()).filter(Boolean);
        const oldMap = new Map((t.subs || []).map(x => [x.text, x]));
        t.subs = lines.map(text => oldMap.get(text) || { id: uid('sb'), text, done: false, completedAt: null, createdAt: Date.now() });
        syncTaskBySubs(t);
        K.save(true);
        paintTodoList(host); paintQuads(host); paintTimeline(host); paintQuadStats(host); K.updateBadges();
        K.toast('已保存修改', 'save');
      },
    });
    on($('#edQuad'), 'click', '[data-q]', (e, el) => {
      $$('#edQuad .chip').forEach(c => {
        const q = QMAP[c.dataset.q];
        c.classList.toggle('on', c === el);
        c.style.cssText = c === el ? `background:linear-gradient(120deg,${q.c},${q.c}cc);border-color:transparent` : '';
        const dot = c.querySelector('.q-dot');
        if (dot) dot.style.background = c === el ? '#fff' : q.c;
      });
    });
  }

  K.registerView('today', { render });
})(window.KKX);

</script>
<script>
/* inlined from js/views-schedule.js */
/* ============================================================
   本周排班表 · 白班 / 机动 / 晚班 / 休息 + 加班记录
   ============================================================ */
(function (K) {
  'use strict';
  const { $, $$, esc, icon, on, jitter, fmtDate, addDays, startOfWeek, todayStr, SHIFTS, SHIFT_KEYS, WD_CN } = K;

  let weekOffset = 0;

  const anchor = () => addDays(startOfWeek(), weekOffset * 7);
  const days = () => Array.from({ length: 7 }, (_, i) => addDays(anchor(), i));
  function cell(ds) {
    const s = K.state();
    if (!s.schedule[ds]) s.schedule[ds] = { shift: '', ot: false, otH: 0 };
    return s.schedule[ds];
  }

  function render(host) {
    const ds = days();
    const rows = ds.map(d => ({ d, ds: fmtDate(d), c: cell(fmtDate(d)) }));
    const workDays = rows.filter(r => SHIFTS[r.c.shift] && SHIFTS[r.c.shift].work).length;
    const offDays = rows.filter(r => r.c.shift === 'off').length;
    const otCount = rows.filter(r => r.c.ot && K.num(r.c.otH) > 0).length;
    const otTotal = rows.reduce((n, r) => n + (r.c.ot ? K.num(r.c.otH) : 0), 0);
    const range = `${anchor().getMonth() + 1}月${anchor().getDate()}日 – ${ds[6].getMonth() + 1}月${ds[6].getDate()}日`;
    const label = weekOffset === 0 ? '本周' : weekOffset === -1 ? '上周' : weekOffset === 1 ? '下周'
      : (weekOffset < 0 ? `${-weekOffset} 周前` : `${weekOffset} 周后`);

    // 班型分布
    const dist = SHIFT_KEYS.map(k => ({ k, n: rows.filter(r => r.c.shift === k).length }));

    host.innerHTML = `
      <div class="stagger">
        <div class="grid g-4">
          ${K.statCard('calendar', workDays, '天', '本周上班天数')}
          ${K.statCard('leaf', offDays, '天', '本周休息天数')}
          ${K.statCard('zap', otCount, '次', '加班次数')}
          ${K.statCard('timer', Math.round(otTotal * 10) / 10, 'h', '加班总时长',
            `<div style="flex:none">${K.ring(Math.min(100, otTotal / 12 * 100), { size: 52, sw: 5.5, color: '#E3B77E', val: '' })}</div>`)}
        </div>

        <div class="card section-gap">
          ${K.cardHead('calendar', `${label}排班`, range,
            `<button class="icon-btn tiny" id="wPrev" title="上一周">${icon('chevLeft')}</button>
             <button class="btn xs" id="wNow">${icon('target')}回到本周</button>
             <button class="icon-btn tiny" id="wNext" title="下一周">${icon('chevRight')}</button>`)}

          <div class="sched-grid" id="schedGrid">
            ${rows.map(r => dayCard(r)).join('')}
          </div>

          <div class="flex aic jcb wrap gap14 mt18">
            <div class="legend">
              ${SHIFT_KEYS.map(k => `<span class="legend-item">
                <span class="legend-swatch" style="background:${SHIFTS[k].c}"></span>${SHIFTS[k].label}
                <span class="faint">· ${dist.find(d => d.k === k).n}天</span></span>`).join('')}
            </div>
            <div class="flex gap6 wrap">
              <button class="btn xs" id="copyPrev">${icon('copy')}复制上周排班</button>
              <button class="btn xs" id="fill5">${icon('grid')}工作日白班 + 周末休</button>
              <button class="btn xs danger" id="clearWeek">${icon('trash')}清空本周</button>
            </div>
          </div>
        </div>

        <div class="grid g-2 section-gap">
          <div class="card">
            ${K.cardHead('trend', '加班时长分布', otTotal ? `本周共加班 ${Math.round(otTotal * 10) / 10} 小时` : '本周暂无加班记录，很好 ✦')}
            ${K.bars(rows.map(r => ({ label: WD_CN[r.d.getDay()].replace('周', ''), v: r.c.ot ? K.num(r.c.otH) : 0 })),
              { unit: 'h', hlIndex: rows.findIndex(r => r.ds === todayStr()), color: 'linear-gradient(180deg,#EFCF9F,#D9A45F)' })}
          </div>
          <div class="card">
            ${K.cardHead('info', '排班小结', '基于本周排班自动生成')}
            <div class="flex" style="flex-direction:column;gap:11px">
              ${summaryRows(rows, workDays, offDays, otTotal)}
            </div>
          </div>
        </div>
      </div>`;

    bind(host);
  }

  function dayCard(r) {
    const sh = SHIFTS[r.c.shift];
    const today = r.ds === todayStr();
    return `<div class="day-card ${today ? 'is-today' : ''}" data-ds="${r.ds}" style="--sc:${sh ? sh.c : 'transparent'}">
      <div class="dc-top">
        <div>
          <div class="dc-wd">${WD_CN[r.d.getDay()]}</div>
          <div class="dc-date">${r.d.getMonth() + 1}/${r.d.getDate()}</div>
        </div>
        ${today ? '<span class="dc-today-tag">TODAY</span>' : ''}
      </div>
      <div class="shift-pick">
        ${SHIFT_KEYS.map(k => {
          const on = r.c.shift === k;
          return `<button class="shift-opt ${on ? 'on' : ''}" data-shift="${r.ds}|${k}"
            style="--oc:${SHIFTS[k].c};--oc-sh:${SHIFTS[k].sh}">${SHIFTS[k].label}</button>`;
        }).join('')}
      </div>
      <div class="ot-row">
        <span class="ot-label">加班</span>
        <button class="switch ${r.c.ot ? 'on' : ''}" data-ot="${r.ds}" aria-label="加班开关"></button>
        <span class="ot-input ${r.c.ot ? '' : 'hidden'}" data-otbox="${r.ds}">
          <input type="number" min="0" max="14" step="0.5" value="${K.num(r.c.otH)}" data-oth="${r.ds}">
          <span>h</span>
        </span>
      </div>
    </div>`;
  }

  function summaryRows(rows, workDays, offDays, otTotal) {
    const nightN = rows.filter(r => r.c.shift === 'night').length;
    const flexN = rows.filter(r => r.c.shift === 'flex').length;
    const unset = rows.filter(r => !r.c.shift).length;
    const items = [];
    items.push(['calendar', `本周共 ${workDays} 天班、${offDays} 天休${unset ? `，还有 ${unset} 天未排` : ''}`]);
    if (nightN) items.push(['moon', `晚班 ${nightN} 天，注意补觉与作息调整`]);
    if (flexN) items.push(['repeat', `机动班 ${flexN} 天，留些弹性给突发安排`]);
    if (otTotal >= 8) items.push(['zap', `加班已达 ${Math.round(otTotal * 10) / 10} 小时，记得给自己留出休息时间`]);
    else if (otTotal > 0) items.push(['zap', `加班 ${Math.round(otTotal * 10) / 10} 小时，强度尚可`]);
    else items.push(['heart', '本周零加班，作息节奏很健康 ✦']);
    if (offDays === 0 && workDays > 0) items.push(['info', '本周没有安排休息日，建议至少留出一天恢复精力']);
    return items.map(([ic, t]) => `
      <div class="flex aic gap10" style="padding:10px 12px;border-radius:var(--r-md);
        background:rgba(255,255,255,.55);border:1px solid var(--hairline)">
        <span style="display:grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;
          background:linear-gradient(145deg,#fff,var(--lav-100));color:var(--lav-600)">${icon(ic)}</span>
        <span class="fs12 fw6" style="color:var(--ink-soft)">${esc(t)}</span>
      </div>`).join('');
  }

  function bind(host) {
    $('#wPrev', host).onclick = (e) => { weekOffset--; jitter(e.currentTarget); K.render(); };
    $('#wNext', host).onclick = (e) => { weekOffset++; jitter(e.currentTarget); K.render(); };
    $('#wNow', host).onclick = (e) => { weekOffset = 0; jitter(e.currentTarget); K.render(); };

    // 选班型
    on(host, 'click', '[data-shift]', (e, el) => {
      const [ds, k] = el.dataset.shift.split('|');
      const c = cell(ds);
      c.shift = c.shift === k ? '' : k;
      if (c.shift === 'off') { c.ot = false; c.otH = 0; }
      K.save();
      jitter(el.closest('.day-card'));
      K.render();
    });

    // 加班开关
    on(host, 'click', '[data-ot]', (e, el) => {
      const ds = el.dataset.ot;
      const c = cell(ds);
      c.ot = !c.ot;
      if (c.ot && !K.num(c.otH)) c.otH = 1;
      if (!c.ot) c.otH = 0;
      el.classList.toggle('on', c.ot);
      $(`[data-otbox="${ds}"]`, host).classList.toggle('hidden', !c.ot);
      const inp = $(`[data-oth="${ds}"]`, host);
      if (inp) inp.value = K.num(c.otH);
      K.save();
      if (c.ot) setTimeout(() => inp && inp.select(), 60);
      K.render();
    });

    // 加班时长
    on(host, 'change', '[data-oth]', (e, el) => {
      const c = cell(el.dataset.oth);
      c.otH = K.clamp(K.num(el.value), 0, 14);
      el.value = c.otH;
      K.save(); K.render();
    });
    on(host, 'keydown', '[data-oth]', (e, el) => { if (e.key === 'Enter') el.blur(); });

    // 批量操作
    $('#copyPrev', host).onclick = () => {
      const s = K.state();
      let n = 0;
      days().forEach((d) => {
        const prev = fmtDate(addDays(d, -7));
        const src = s.schedule[prev];
        if (src && src.shift) { s.schedule[fmtDate(d)] = { shift: src.shift, ot: !!src.ot, otH: K.num(src.otH) }; n++; }
      });
      K.save(true);
      n ? K.toast(`已复制上周 ${n} 天排班`, 'copy') : K.toast('上周没有排班记录', 'info');
      K.render();
    };
    $('#fill5', host).onclick = () => {
      const s = K.state();
      days().forEach((d, i) => {
        s.schedule[fmtDate(d)] = { shift: i < 5 ? 'day' : 'off', ot: false, otH: 0 };
      });
      K.save(true); K.toast('已套用「工作日白班」模板', 'grid'); K.render();
    };
    $('#clearWeek', host).onclick = () => {
      K.confirmBox('清空本周排班', '将清除本周 7 天的班型与加班记录，确定继续吗？', () => {
        const s = K.state();
        days().forEach(d => { delete s.schedule[fmtDate(d)]; });
        K.save(true); K.toast('已清空', 'trash'); K.render();
      }, '确认清空');
    };
  }

  K.registerView('schedule', { render });
})(window.KKX);

</script>
<script>
/* inlined from js/views-learn.js */
/* ============================================================
   学习管理 · 计划与进度追踪
   运动管理 · 类型 / 时长 / 消耗 + 周月统计
   ============================================================ */
(function (K) {
  'use strict';
  const { $, $$, esc, icon, uid, on, jitter, fmtDate, addDays, startOfWeek, todayStr, WD_CN } = K;

  /* =========================================================
     学习管理
     ========================================================= */
  const STUDY_CATS = ['语言', '专业', '阅读', '考证', '技能', '兴趣'];
  const CAT_COLOR = { 语言: '#9FB6E3', 专业: '#C3A9DE', 阅读: '#9CC9B4', 考证: '#E9A0AE', 技能: '#E6C08D', 兴趣: '#A9C7CF' };
  let studySort = 'active'; // active | progress | name

  function studyRender(host) {
    const s = K.state();
    let list = s.study.slice();
    const pctOf = x => x.targetH > 0 ? Math.min(100, Math.round(K.num(x.doneH) / K.num(x.targetH) * 100)) : 0;

    if (studySort === 'progress') list.sort((a, b) => pctOf(b) - pctOf(a));
    else if (studySort === 'name') list.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
    else list.sort((a, b) => (pctOf(a) >= 100 ? 1 : 0) - (pctOf(b) >= 100 ? 1 : 0) || b.createdAt - a.createdAt);

    const totalTarget = s.study.reduce((n, x) => n + K.num(x.targetH), 0);
    const totalDone = s.study.reduce((n, x) => n + K.num(x.doneH), 0);
    const overall = totalTarget ? Math.min(100, Math.round(totalDone / totalTarget * 100)) : 0;
    const finished = s.study.filter(x => pctOf(x) >= 100).length;

    // 本周学习时长
    const wd = K.agg.weekDays();
    const weekData = wd.map(d => ({ label: WD_CN[d.getDay()].replace('周', ''), v: Math.round(K.agg.studyHoursOn(fmtDate(d)) * 10) / 10 }));
    const weekTotal = weekData.reduce((n, x) => n + x.v, 0);

    host.innerHTML = `
      <div class="stagger">
        <div class="grid g-4">
          ${K.statCard('book', s.study.length, '个', '学习计划总数')}
          ${K.statCard('timer', Math.round(totalDone * 10) / 10, 'h', `目标 ${Math.round(totalTarget * 10) / 10} h`)}
          ${K.statCard('check', finished, '个', '已达成计划')}
          ${K.statCard('trend', overall, '%', '总体完成度',
            `<div style="flex:none">${K.ring(overall, { size: 52, sw: 5.5, color: 'var(--lav-500)' })}</div>`)}
        </div>

        <div class="grid g-2 section-gap" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
          <div class="card">
            ${K.cardHead('book', '学习计划', '点击 +0.5h / +1h 快速累计时长',
              `<div class="seg" id="stSort">
                 <button data-s="active" class="${studySort === 'active' ? 'on' : ''}">进行中</button>
                 <button data-s="progress" class="${studySort === 'progress' ? 'on' : ''}">按进度</button>
                 <button data-s="name" class="${studySort === 'name' ? 'on' : ''}">按名称</button>
               </div>
               <button class="btn xs primary" id="stAdd">${icon('plus')}新计划</button>`)}
            <div class="flex" style="flex-direction:column;gap:11px" id="stList">
              ${list.length ? list.map(x => studyItem(x, pctOf(x))).join('') : K.emptyBox('还没有学习计划，点「新计划」开始你的成长路线 ✦', 'book')}
            </div>
          </div>

          <div>
            <div class="card">
              ${K.cardHead('trend', '本周学习时长', weekTotal ? `本周累计 ${Math.round(weekTotal * 10) / 10} 小时` : '本周还没有学习记录')}
              ${K.bars(weekData, { unit: 'h', hlIndex: wd.findIndex(d => fmtDate(d) === todayStr()) })}
            </div>
            <div class="card section-gap">
              ${K.cardHead('layers', '分类占比', '不同领域的时间投入')}
              <div id="stCats"></div>
            </div>
          </div>
        </div>
      </div>`;

    paintCats(host);
    studyBind(host);
  }

  function studyItem(x, pct) {
    const c = CAT_COLOR[x.cat] || 'var(--lav-500)';
    const done = pct >= 100;
    return `<div class="study-item" data-id="${x.id}" style="${done ? 'background:linear-gradient(135deg,rgba(156,201,180,.12),rgba(255,255,255,.7))' : ''}">
      <div class="si-top">
        <span style="display:grid;place-items:center;width:32px;height:32px;border-radius:10px;flex:none;
          background:${c}22;color:${c}">${icon(done ? 'check' : 'book')}</span>
        <div class="flex1">
          <div class="si-title">${esc(x.title)} ${done ? '<span class="tag-static" style="background:rgba(156,201,180,.2);color:#4E8C71">已达成</span>' : ''}</div>
          <div class="si-meta">
            <span class="tag-static" style="background:${c}1f;color:${c}">${esc(x.cat || '其他')}</span>
            ${Math.round(K.num(x.doneH) * 10) / 10} / ${Math.round(K.num(x.targetH) * 10) / 10} 小时
            ${x.note ? ` · ${esc(x.note)}` : ''}
          </div>
        </div>
        <div class="si-acts">
          <button class="icon-btn ghost tiny" data-stedit="${x.id}" title="编辑">${icon('pencil')}</button>
          <button class="icon-btn ghost tiny" data-stdel="${x.id}" title="删除">${icon('trash')}</button>
        </div>
      </div>
      <div class="si-prog">
        <div class="pbar"><i style="width:${pct}%;background:linear-gradient(90deg,${c},${c}bb)"></i></div>
        <span class="si-pct" style="color:${c}">${pct}%</span>
      </div>
      <div class="si-quick">
        ${[0.5, 1, 2].map(h => `<button class="btn xs" data-stlog="${x.id}|${h}">${icon('plus')}${h}h</button>`).join('')}
        <button class="btn xs" data-stlog="${x.id}|-0.5">${icon('minus')}0.5h</button>
        <button class="btn xs" data-stdone="${x.id}">${icon('flag')}标记达成</button>
      </div>
    </div>`;
  }

  function paintCats(host) {
    const s = K.state();
    const box = $('#stCats', host);
    if (!box) return;
    const map = {};
    s.study.forEach(x => { const c = x.cat || '其他'; map[c] = (map[c] || 0) + K.num(x.doneH); });
    const rows = Object.entries(map).sort((a, b) => b[1] - a[1]);
    if (!rows.length) { box.innerHTML = K.emptyBox('暂无数据', 'layers'); return; }
    const total = rows.reduce((n, r) => n + r[1], 0) || 1;
    box.innerHTML = rows.map(([cat, h]) => {
      const c = CAT_COLOR[cat] || 'var(--lav-500)';
      const p = Math.round(h / total * 100);
      return `<div style="margin-bottom:12px">
        <div class="flex aic jcb" style="margin-bottom:5px">
          <span class="flex aic gap6 fs12 fw6"><span class="q-dot" style="background:${c}"></span>${esc(cat)}</span>
          <span class="fs11 fw7 tnum" style="color:${c}">${Math.round(h * 10) / 10}h · ${p}%</span>
        </div>
        <div class="pbar" style="height:6px"><i style="width:${p}%;background:linear-gradient(90deg,${c},${c}bb)"></i></div>
      </div>`;
    }).join('');
  }

  function studyForm(x) {
    const v = x || { title: '', cat: '语言', targetH: 20, doneH: 0, note: '' };
    return `
      <div class="field"><label>学习内容</label>
        <input class="input" id="sfTitle" value="${esc(v.title)}" placeholder="例如：英语口语 · 每日跟读" maxlength="40"></div>
      <div class="row">
        <div class="field"><label>分类</label>
          <select class="select" id="sfCat">${STUDY_CATS.map(c => `<option ${c === v.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label>目标时长（小时）</label>
          <input class="input" id="sfTarget" type="number" min="0.5" step="0.5" value="${K.num(v.targetH, 20)}"></div>
        <div class="field"><label>已完成（小时）</label>
          <input class="input" id="sfDone" type="number" min="0" step="0.5" value="${K.num(v.doneH)}"></div>
      </div>
      <div class="field"><label>备注（可选）</label>
        <input class="input" id="sfNote" value="${esc(v.note || '')}" placeholder="目标、方法或提醒" maxlength="40"></div>`;
  }

  function studyBind(host) {
    const s = K.state();

    on($('#stSort', host), 'click', 'button', (e, el) => { studySort = el.dataset.s; K.render(); });

    $('#stAdd', host).onclick = () => {
      K.openModal({
        title: '新建学习计划', okText: '创建', body: studyForm(null),
        onOK(body) {
          const t = $('#sfTitle', body).value.trim();
          if (!t) return false;
          s.study.push({
            id: uid('st'), title: t, cat: $('#sfCat', body).value,
            targetH: Math.max(0.5, K.num($('#sfTarget', body).value, 20)),
            doneH: Math.max(0, K.num($('#sfDone', body).value)),
            note: $('#sfNote', body).value.trim(), createdAt: Date.now(), logs: [],
          });
          K.save(true); K.render(); K.toast('学习计划已创建', 'book');
        },
      });
    };

    on(host, 'click', '[data-stedit]', (e, el) => {
      const x = s.study.find(y => y.id === el.dataset.stedit); if (!x) return;
      K.openModal({
        title: '编辑学习计划', okText: '保存', body: studyForm(x),
        onOK(body) {
          const t = $('#sfTitle', body).value.trim(); if (!t) return false;
          x.title = t; x.cat = $('#sfCat', body).value;
          x.targetH = Math.max(0.5, K.num($('#sfTarget', body).value, 20));
          x.doneH = Math.max(0, K.num($('#sfDone', body).value));
          x.note = $('#sfNote', body).value.trim();
          K.save(true); K.render(); K.toast('已保存', 'save');
        },
      });
    });

    on(host, 'click', '[data-stdel]', (e, el) => {
      const x = s.study.find(y => y.id === el.dataset.stdel); if (!x) return;
      K.confirmBox('删除学习计划', `确定删除「${x.title}」及其时长记录吗？`, () => {
        s.study = s.study.filter(y => y.id !== x.id);
        K.save(true); K.render(); K.toast('已删除', 'trash');
      });
    });

    on(host, 'click', '[data-stlog]', (e, el) => {
      const [id, h] = el.dataset.stlog.split('|');
      const x = s.study.find(y => y.id === id); if (!x) return;
      const dh = K.num(h);
      x.doneH = Math.max(0, K.num(x.doneH) + dh);
      x.logs = x.logs || [];
      const t = todayStr();
      const lg = x.logs.find(l => l.date === t);
      if (lg) { lg.h = Math.max(0, K.num(lg.h) + dh); if (!lg.h) x.logs = x.logs.filter(l => l !== lg); }
      else if (dh > 0) x.logs.push({ date: t, h: dh });
      K.save(); jitter(el.closest('.study-item')); K.render();
      K.toast(dh > 0 ? `已累计 ${dh} 小时 ✦` : `已回退 ${-dh} 小时`, dh > 0 ? 'timer' : 'refresh');
    });

    on(host, 'click', '[data-stdone]', (e, el) => {
      const x = s.study.find(y => y.id === el.dataset.stdone); if (!x) return;
      const need = Math.max(0, K.num(x.targetH) - K.num(x.doneH));
      x.doneH = K.num(x.targetH);
      if (need > 0) { x.logs = x.logs || []; const t = todayStr();
        const lg = x.logs.find(l => l.date === t);
        lg ? lg.h = K.num(lg.h) + need : x.logs.push({ date: t, h: need }); }
      K.save(); K.render(); K.toast('目标达成，太棒了 ✦', 'star');
    });
  }

  K.registerView('study', { render: studyRender });

  /* =========================================================
     运动管理
     ========================================================= */
  const EX_TYPES = [
    { n: '跑步', ic: 'pulse', c: '#E9A0AE', kcalPerMin: 9 },
    { n: '瑜伽', ic: 'leaf', c: '#9CC9B4', kcalPerMin: 3.5 },
    { n: '力量训练', ic: 'dumbbell', c: '#C3A9DE', kcalPerMin: 6 },
    { n: '骑行', ic: 'bike', c: '#9FB6E3', kcalPerMin: 7 },
    { n: '游泳', ic: 'droplet', c: '#A9C7CF', kcalPerMin: 10 },
    { n: '快走', ic: 'sunrise', c: '#E6C08D', kcalPerMin: 4.5 },
    { n: '跳绳', ic: 'zap', c: '#EFB6A0', kcalPerMin: 11 },
    { n: '拉伸', ic: 'heart', c: '#D6BFE0', kcalPerMin: 2.5 },
  ];
  const exType = n => EX_TYPES.find(t => t.n === n) || { n, ic: 'pulse', c: 'var(--lav-500)', kcalPerMin: 6 };

  function exRender(host) {
    const s = K.state();
    const range = s.ui.exRange || 'week';
    const recs = s.exercise.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

    // 区间数据
    const now = new Date();
    let inRange, chart, chartUnit = 'min', title;
    if (range === 'week') {
      const wd = K.agg.weekDays();
      const set = wd.map(fmtDate);
      inRange = s.exercise.filter(e => set.includes(e.date));
      chart = wd.map(d => {
        const ds = fmtDate(d);
        return { label: WD_CN[d.getDay()].replace('周', ''), v: K.agg.exerciseOn(ds).reduce((n, e) => n + K.num(e.minutes), 0) };
      });
      title = '本周运动时长';
    } else {
      const y = now.getFullYear(), m = now.getMonth();
      inRange = s.exercise.filter(e => { const d = K.parseDate(e.date); return d.getFullYear() === y && d.getMonth() === m; });
      const dim = new Date(y, m + 1, 0).getDate();
      const weeks = Math.ceil(dim / 7);
      chart = Array.from({ length: weeks }, (_, i) => {
        const from = i * 7 + 1, to = Math.min(dim, from + 6);
        const v = inRange.filter(e => { const dd = K.parseDate(e.date).getDate(); return dd >= from && dd <= to; })
          .reduce((n, e) => n + K.num(e.minutes), 0);
        return { label: `${from}-${to}`, v };
      });
      title = `${now.getMonth() + 1}月运动时长`;
    }
    const cnt = inRange.length;
    const mins = inRange.reduce((n, e) => n + K.num(e.minutes), 0);
    const kcal = inRange.reduce((n, e) => n + K.num(e.kcal), 0);
    const activeDays = new Set(inRange.map(e => e.date)).size;

    // 类型分布
    const tmap = {};
    inRange.forEach(e => { tmap[e.type] = (tmap[e.type] || 0) + K.num(e.minutes); });
    const tRows = Object.entries(tmap).sort((a, b) => b[1] - a[1]);
    const tTotal = tRows.reduce((n, r) => n + r[1], 0) || 1;

    host.innerHTML = `
      <div class="stagger">
        <div class="flex aic jcb wrap gap10">
          <div class="seg" id="exRange">
            <button data-r="week" class="${range === 'week' ? 'on' : ''}">本周</button>
            <button data-r="month" class="${range === 'month' ? 'on' : ''}">本月</button>
          </div>
          <button class="btn primary" id="exAdd">${icon('plus')}记录一次运动</button>
        </div>

        <div class="grid g-4 section-gap">
          ${K.statCard('pulse', cnt, '次', range === 'week' ? '本周运动次数' : '本月运动次数')}
          ${K.statCard('timer', mins, 'min', `平均 ${cnt ? Math.round(mins / cnt) : 0} min/次`)}
          ${K.statCard('flame', kcal, 'kcal', '累计消耗')}
          ${K.statCard('calendar', activeDays, '天', '有运动的天数',
            `<div style="flex:none">${K.ring(Math.round(activeDays / (range === 'week' ? 7 : 30) * 100), { size: 52, sw: 5.5, color: '#E9A0AE' })}</div>`)}
        </div>

        <div class="grid g-2 section-gap" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">
          <div class="card">
            ${K.cardHead('trend', title, mins ? `共 ${mins} 分钟 · ${kcal} kcal` : '这个区间还没有记录')}
            ${K.bars(chart, { unit: chartUnit, hlIndex: range === 'week' ? K.agg.weekDays().findIndex(d => fmtDate(d) === todayStr()) : -1,
              color: 'linear-gradient(180deg,#EFB6C2,#D97F92)' })}
          </div>
          <div class="card">
            ${K.cardHead('layers', '项目分布', '你最偏爱哪种运动')}
            ${tRows.length ? tRows.map(([n, v]) => {
              const t = exType(n), p = Math.round(v / tTotal * 100);
              return `<div style="margin-bottom:12px">
                <div class="flex aic jcb" style="margin-bottom:5px">
                  <span class="flex aic gap6 fs12 fw6">
                    <span style="display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:${t.c}22;color:${t.c}">${icon(t.ic)}</span>
                    ${esc(n)}</span>
                  <span class="fs11 fw7 tnum" style="color:${t.c}">${v}min · ${p}%</span>
                </div>
                <div class="pbar" style="height:6px"><i style="width:${p}%;background:linear-gradient(90deg,${t.c},${t.c}bb)"></i></div>
              </div>`;
            }).join('') : K.emptyBox('暂无数据，去记录一次运动吧 ✦', 'pulse')}
          </div>
        </div>

        <div class="card section-gap">
          ${K.cardHead('checklist', '运动记录', recs.length ? `共 ${recs.length} 条记录` : '还没有任何记录')}
          <div class="flex" style="flex-direction:column;gap:9px">
            ${recs.length ? recs.slice(0, 24).map(exItem).join('') : K.emptyBox('点右上角「记录一次运动」开始 ✦', 'pulse')}
          </div>
        </div>
      </div>`;

    exBind(host);
  }

  function exItem(e) {
    const t = exType(e.type);
    const d = K.parseDate(e.date);
    const today = e.date === todayStr();
    return `<div class="ex-item" data-id="${e.id}">
      <div class="si-top">
        <span style="display:grid;place-items:center;width:34px;height:34px;border-radius:11px;flex:none;
          background:${t.c}22;color:${t.c}">${icon(t.ic)}</span>
        <div class="flex1">
          <div class="si-title">${esc(e.type)}
            ${today ? '<span class="tag-static">今天</span>' : ''}
          </div>
          <div class="si-meta">${d.getMonth() + 1}月${d.getDate()}日 ${WD_CN[d.getDay()]} · ${K.num(e.minutes)} 分钟 · ${K.num(e.kcal)} kcal${e.note ? ` · ${esc(e.note)}` : ''}</div>
        </div>
        <div class="si-acts">
          <button class="icon-btn ghost tiny" data-exedit="${e.id}" title="编辑">${icon('pencil')}</button>
          <button class="icon-btn ghost tiny" data-exdel="${e.id}" title="删除">${icon('trash')}</button>
        </div>
      </div>
    </div>`;
  }

  function exForm(e) {
    const v = e || { type: '跑步', minutes: 30, kcal: 270, date: todayStr(), note: '' };
    return `
      <div class="field"><label>运动类型</label>
        <div class="chip-wrap" id="efTypes">
          ${EX_TYPES.map(t => `<span class="chip ${t.n === v.type ? 'on' : ''}" data-t="${esc(t.n)}"
            style="${t.n === v.type ? `background:linear-gradient(120deg,${t.c},${t.c}cc);border-color:transparent` : ''}">${icon(t.ic)}${esc(t.n)}</span>`).join('')}
        </div></div>
      <div class="row">
        <div class="field"><label>日期</label><input class="input" id="efDate" type="date" value="${esc(v.date)}"></div>
        <div class="field"><label>时长（分钟）</label><input class="input" id="efMin" type="number" min="1" max="600" value="${K.num(v.minutes, 30)}"></div>
        <div class="field"><label>消耗（kcal）</label><input class="input" id="efKcal" type="number" min="0" max="5000" value="${K.num(v.kcal)}"></div>
      </div>
      <div class="field"><label>备注（可选）</label><input class="input" id="efNote" value="${esc(v.note || '')}" placeholder="配速、感受、地点…" maxlength="40"></div>
      <p class="fs11 faint">修改类型或时长时，消耗会按经验值自动估算，也可手动覆盖。</p>`;
  }

  function bindExForm(body) {
    let auto = true;
    const est = () => {
      if (!auto) return;
      const cur = $('#efTypes .chip.on', body);
      const t = exType(cur ? cur.dataset.t : '跑步');
      $('#efKcal', body).value = Math.round(K.num($('#efMin', body).value, 30) * t.kcalPerMin);
    };
    on($('#efTypes', body), 'click', '[data-t]', (e, el) => {
      $$('#efTypes .chip', body).forEach(c => {
        const t = exType(c.dataset.t);
        c.classList.toggle('on', c === el);
        c.style.cssText = c === el ? `background:linear-gradient(120deg,${t.c},${t.c}cc);border-color:transparent` : '';
      });
      est();
    });
    $('#efMin', body).addEventListener('input', est);
    $('#efKcal', body).addEventListener('input', () => { auto = false; });
  }

  function exBind(host) {
    const s = K.state();
    on($('#exRange', host), 'click', 'button', (e, el) => { s.ui.exRange = el.dataset.r; K.save(); K.render(); });

    $('#exAdd', host).onclick = () => {
      const body = K.openModal({
        title: '记录一次运动', okText: '保存', body: exForm(null),
        onOK(b) {
          const cur = $('#efTypes .chip.on', b);
          s.exercise.push({
            id: uid('ex'), type: cur ? cur.dataset.t : '跑步',
            date: $('#efDate', b).value || todayStr(),
            minutes: K.clamp(K.num($('#efMin', b).value, 30), 1, 600),
            kcal: Math.max(0, K.num($('#efKcal', b).value)),
            note: $('#efNote', b).value.trim(),
          });
          K.save(true); K.render(); K.toast('运动记录已保存 ✦', 'pulse');
        },
      });
      bindExForm(body);
    };

    on(host, 'click', '[data-exedit]', (e, el) => {
      const x = s.exercise.find(y => y.id === el.dataset.exedit); if (!x) return;
      const body = K.openModal({
        title: '编辑运动记录', okText: '保存', body: exForm(x),
        onOK(b) {
          const cur = $('#efTypes .chip.on', b);
          x.type = cur ? cur.dataset.t : x.type;
          x.date = $('#efDate', b).value || x.date;
          x.minutes = K.clamp(K.num($('#efMin', b).value, 30), 1, 600);
          x.kcal = Math.max(0, K.num($('#efKcal', b).value));
          x.note = $('#efNote', b).value.trim();
          K.save(true); K.render(); K.toast('已保存', 'save');
        },
      });
      bindExForm(body);
    });

    on(host, 'click', '[data-exdel]', (e, el) => {
      const x = s.exercise.find(y => y.id === el.dataset.exdel); if (!x) return;
      K.confirmBox('删除运动记录', `确定删除 ${x.date} 的「${x.type}」记录吗？`, () => {
        s.exercise = s.exercise.filter(y => y.id !== x.id);
        K.save(true); K.render(); K.toast('已删除', 'trash');
      });
    });
  }

  K.registerView('exercise', { render: exRender });
})(window.KKX);

</script>
<script>
/* inlined from js/views-workrecord.js */
/* ============================================================
   工作记录 · 按周总结：计划 / 制作中 / 已完成
   每项工作可添加子栏目，记录详细工作内容
   ============================================================ */
(function (K) {
  'use strict';
  const { $, $$, esc, icon, uid, on, jitter, fmtDate, addDays, startOfWeek, parseDate, WD_CN, num } = K;

  const CATS = [
    { key: 'plan',  title: '计划',   sub: '本周计划', icon: 'flag',  c: '#9FB6E3' },
    { key: 'doing', title: '制作中', sub: '进行中',   icon: 'zap',   c: '#C3A9DE' },
    { key: 'done',  title: '已完成', sub: '本周收尾', icon: 'check', c: '#9CC9B4' },
  ];
  const CMAP = CATS.reduce((m, c) => (m[c.key] = c, m), {});
  const NEXT = { plan: 'doing', doing: 'done', done: 'plan' };

  let curKey = null; // 当前查看的周（周一日期串）

  /* ---------------- 数据助手 ---------------- */
  function initKey() { if (!curKey) curKey = fmtDate(startOfWeek()); }
  function weekKey(anchor) { return fmtDate(startOfWeek(anchor || new Date())); }

  function getWeek(key) {
    const s = K.state();
    s.workrecord[key] = s.workrecord[key] || { key, items: [] };
    return s.workrecord[key];
  }
  function itemsOf(key) { return getWeek(key).items; }

  function findItem(id) { return itemsOf(curKey).find(x => x.id === id); }
  function findSub(sid) {
    for (const it of itemsOf(curKey)) {
      const sub = (it.subs || []).find(s => s.id === sid);
      if (sub) return { item: it, sub };
    }
    return null;
  }
  function removeItem(id) {
    const wk = getWeek(curKey);
    wk.items = wk.items.filter(x => x.id !== id);
  }
  function addSub(itemId, host) {
    const it = findItem(itemId);
    if (!it) return;
    const input = $(`[data-addsub="${itemId}"]`, host);
    const text = input ? input.value.trim() : '';
    if (!text) { if (input) { input.focus(); jitter(input); } return; }
    it.subs = it.subs || [];
    it.subs.push({ id: uid('ws'), text, done: false, createdAt: Date.now() });
    K.save(); K.render(); K.toast('已添加子项', 'plus');
  }

  function isoWeek(d) {
    const start = new Date(d.getFullYear(), 0, 1);
    const diff = (d - start) / 864e5;
    return Math.ceil((diff + start.getDay() + 1) / 7);
  }
  function weekRangeLabel(key) {
    const ws = parseDate(key);
    const we = addDays(ws, 6);
    const n = isoWeek(ws);
    const isThis = key === weekKey();
    return `${ws.getMonth() + 1}/${ws.getDate()} - ${we.getMonth() + 1}/${we.getDate()} · 第 ${n} 周${isThis ? ' · 本周' : ''}`;
  }

  /* ---------------- 渲染 ---------------- */
  function render(host) {
    initKey();
    const items = itemsOf(curKey);
    const counts = { plan: 0, doing: 0, done: 0 };
    items.forEach(it => { counts[it.cat] = (counts[it.cat] || 0) + 1; });
    const total = items.length;
    const pct = total ? Math.round(counts.done / total * 100) : 0;

    host.innerHTML = `
      <div class="stagger">
        <div class="workbar">
          <div class="work-week">
            <button class="icon-btn ghost" data-wkprev title="上一周">${icon('chevLeft')}</button>
            <div>
              <div class="wk-label">本周工作记录</div>
              <div class="wk-range">${weekRangeLabel(curKey)}</div>
            </div>
            <button class="icon-btn ghost" data-wknext title="下一周">${icon('chevRight')}</button>
            <button class="btn xs subtle" data-wktoday>回到本周</button>
          </div>
        </div>

        <div class="grid g-4 section-gap">
          ${K.statCard('flag', counts.plan, '项', '计划中')}
          ${K.statCard('zap', counts.doing, '项', '制作中')}
          ${K.statCard('check', counts.done, '项', '已完成',
            `<div style="flex:none">${K.ring(pct, { size: 52, sw: 5.5, color: '#9CC9B4' })}</div>`)}
          ${K.statCard('layers', total, '项', '本周工作总量')}
        </div>

        <div class="work-cols section-gap">
          ${CATS.map(c => colHTML(c, items)).join('')}
        </div>
      </div>`;

    bind(host);
  }

  function colHTML(c, items) {
    const list = items.filter(it => it.cat === c.key);
    return `<div class="work-col card" data-cat="${c.key}" style="border-top:3px solid ${c.c}">
      <div class="work-col-head">
        <div class="wh-ic" style="background:${c.c}22;color:${c.c}">${icon(c.icon)}</div>
        <h4>${esc(c.title)}</h4>
        <span class="wh-ct">${list.length} 项</span>
      </div>
      <div class="work-list">
        ${list.length ? list.map(it => cardHTML(it, c)).join('') : K.emptyBox('还没有内容，点下面添加 ✦', c.icon)}
      </div>
      <button class="btn xs primary" data-wkadd="${c.key}" style="width:100%">${icon('plus')} 添加工作项</button>
    </div>`;
  }

  function cardHTML(it, c) {
    const subs = it.subs || [];
    const doneSubs = subs.filter(s => s.done).length;
    return `<div class="work-card" data-id="${it.id}" style="border-left:3px solid ${c.c}">
      <div class="wc-top">
        <div class="flex1">
          <div class="wc-text">${esc(it.text)}</div>
          ${it.note ? `<div class="wc-note">${esc(it.note)}</div>` : ''}
          ${subs.length ? `<div class="wc-subcnt">子项 ${doneSubs}/${subs.length} 已完成</div>` : ''}
        </div>
        <div class="wc-acts">
          <button class="icon-btn ghost tiny" data-wkmove="${it.id}" title="推进到下一阶段">${icon('chevRight')}</button>
          <button class="icon-btn ghost tiny" data-wkedit="${it.id}" title="编辑">${icon('pencil')}</button>
          <button class="icon-btn ghost tiny" data-wkdel="${it.id}" title="删除">${icon('trash')}</button>
        </div>
      </div>
      ${subs.length ? `<div class="wc-subs">${subs.map(subHTML).join('')}</div>` : ''}
      <div class="wc-add">
        <input class="input sm" placeholder="添加子项细节…" data-addsub="${it.id}" maxlength="60">
        <button class="icon-btn ghost tiny" data-addsubbtn="${it.id}" title="添加子项">${icon('plus')}</button>
      </div>
    </div>`;
  }

  function subHTML(s) {
    return `<div class="wc-sub ${s.done ? 'done' : ''}" data-sub="${s.id}">
      <button class="mini-check ${s.done ? 'on' : ''}" data-subcheck="${s.id}" title="标记完成">${icon('check')}</button>
      <span class="sub-text">${esc(s.text)}</span>
      <button class="icon-btn ghost tiny sub-del" data-subdel="${s.id}" title="删除">${icon('x')}</button>
    </div>`;
  }

  /* ---------------- 交互 ---------------- */
  function bind(host) {
    const s = K.state();

    $('[data-wkprev]', host).onclick = () => { curKey = fmtDate(addDays(parseDate(curKey), -7)); K.render(); };
    $('[data-wknext]', host).onclick = () => { curKey = fmtDate(addDays(parseDate(curKey), 7)); K.render(); };
    $('[data-wktoday]', host).onclick = () => { curKey = weekKey(); K.render(); };

    on(host, 'click', '[data-wkadd]', (e, el) => openItemModal(null, el.dataset.wkadd));
    on(host, 'click', '[data-wkedit]', (e, el) => { const it = findItem(el.dataset.wkedit); if (it) openItemModal(it, it.cat); });
    on(host, 'click', '[data-wkdel]', (e, el) => {
      const it = findItem(el.dataset.wkdel); if (!it) return;
      K.confirmBox('删除工作项', `确定删除「${it.text}」及其所有子项吗？`, () => {
        removeItem(it.id); K.save(true); K.render(); K.toast('已删除', 'trash');
      });
    });
    on(host, 'click', '[data-wkmove]', (e, el) => {
      const it = findItem(el.dataset.wkmove); if (!it) return;
      it.cat = NEXT[it.cat]; K.save(); jitter(el.closest('.work-card'));
      K.render(); K.toast(`已推进到「${CMAP[it.cat].title}」`, 'swap');
    });

    on(host, 'click', '[data-subcheck]', (e, el) => {
      const r = findSub(el.dataset.subcheck); if (!r) return;
      r.sub.done = !r.sub.done; K.save(); K.render();
    });
    on(host, 'click', '[data-subdel]', (e, el) => {
      const r = findSub(el.dataset.subdel); if (!r) return;
      r.item.subs = r.item.subs.filter(x => x.id !== r.sub.id); K.save(); K.render(); K.toast('已删除子项', 'trash');
    });

    on(host, 'click', '[data-addsubbtn]', (e, el) => addSub(el.dataset.addsubbtn, host));
    on(host, 'keydown', '[data-addsub]', (e, el) => {
      if (e.key === 'Enter') { e.preventDefault(); addSub(el.dataset.addsub, host); }
    });
  }

  function openItemModal(it, cat) {
    const v = it || { text: '', note: '', cat };
    const body = K.openModal({
      title: it ? '编辑工作项' : '添加工作项',
      okText: it ? '保存' : '创建',
      body: `
        <div class="field"><label>工作内容</label>
          <input class="input" id="wkText" value="${esc(v.text)}" placeholder="例如：Q3 季度复盘报告" maxlength="40"></div>
        <div class="field"><label>备注（可选）</label>
          <input class="input" id="wkNote" value="${esc(v.note || '')}" placeholder="补充细节、负责人、截止时间…" maxlength="40"></div>
        <div class="field"><label>所属阶段</label>
          <div class="seg" id="wkCat">
            ${CATS.map(c => `<button data-c="${c.key}" class="${c.key === v.cat ? 'on' : ''}">${esc(c.title)}</button>`).join('')}
          </div>
        </div>`,
      onOK(b) {
        const text = $('#wkText', b).value.trim();
        if (!text) return false;
        const onBtn = $$('#wkCat button.on', b)[0];
        const chosen = onBtn ? onBtn.dataset.c : v.cat;
        if (it) {
          it.text = text; it.note = $('#wkNote', b).value.trim(); it.cat = chosen;
          K.save(true); K.render(); K.toast('已保存', 'save');
        } else {
          getWeek(curKey).items.push({ id: uid('wk'), cat: chosen, text, note: $('#wkNote', b).value.trim(), createdAt: Date.now(), subs: [] });
          K.save(true); K.render(); K.toast('工作项已添加', 'briefcase');
        }
      },
    });
    if (body) on($('#wkCat', body), 'click', 'button', (e, el) => {
      $$('#wkCat button', body).forEach(x => x.classList.toggle('on', x === el));
    });
  }

  K.registerView('workrecord', { render });
})(window.KKX);

</script>
<script>
/* inlined from js/views-translate.js */
/* ============================================================
   翻译 · 各国语言 → 中文（可互换）+ 读音（拼音/罗马音 + 语音朗读）
   ============================================================ */
(function (K) {
  'use strict';
  const { $, $$, esc, icon, on, jitter } = K;

  /* ---------------- 语言表 ---------------- */
  const LANGS = [
    { c: 'zh-CN', n: '中文（简体）', s: 'zh-CN' },
    { c: 'zh-TW', n: '中文（繁体）', s: 'zh-TW' },
    { c: 'en',    n: 'English 英语',      s: 'en-US' },
    { c: 'ja',    n: '日本語 日语',        s: 'ja-JP' },
    { c: 'ko',    n: '한국어 韩语',        s: 'ko-KR' },
    { c: 'fr',    n: 'Français 法语',     s: 'fr-FR' },
    { c: 'de',    n: 'Deutsch 德语',      s: 'de-DE' },
    { c: 'es',    n: 'Español 西班牙语',  s: 'es-ES' },
    { c: 'ru',    n: 'Русский 俄语',      s: 'ru-RU' },
    { c: 'pt',    n: 'Português 葡萄牙语', s: 'pt-PT' },
    { c: 'it',    n: 'Italiano 意大利语',  s: 'it-IT' },
    { c: 'th',    n: 'ไทย 泰语',           s: 'th-TH' },
    { c: 'vi',    n: 'Tiếng Việt 越南语',  s: 'vi-VN' },
    { c: 'ar',    n: 'العربية 阿拉伯语',    s: 'ar-SA' },
    { c: 'id',    n: 'Indonesia 印尼语',   s: 'id-ID' },
    { c: 'ms',    n: 'Melayu 马来语',      s: 'ms-MY' },
    { c: 'tr',    n: 'Türkçe 土耳其语',    s: 'tr-TR' },
    { c: 'nl',    n: 'Nederlands 荷兰语',  s: 'nl-NL' },
    { c: 'pl',    n: 'Polski 波兰语',      s: 'pl-PL' },
    { c: 'hi',    n: 'हिन्दी 印地语',        s: 'hi-IN' },
    { c: 'sv',    n: 'Svenska 瑞典语',     s: 'sv-SE' },
    { c: 'el',    n: 'Ελληνικά 希腊语',    s: 'el-GR' },
    { c: 'he',    n: 'עברית 希伯来语',      s: 'he-IL' },
    { c: 'uk',    n: 'Українська 乌克兰语', s: 'uk-UA' },
    { c: 'cs',    n: 'Čeština 捷克语',     s: 'cs-CZ' },
    { c: 'da',    n: 'Dansk 丹麦语',       s: 'da-DK' },
    { c: 'fi',    n: 'Suomi 芬兰语',       s: 'fi-FI' },
    { c: 'no',    n: 'Norsk 挪威语',       s: 'nb-NO' },
    { c: 'ro',    n: 'Română 罗马尼亚语',  s: 'ro-RO' },
    { c: 'hu',    n: 'Magyar 匈牙利语',    s: 'hu-HU' },
    { c: 'fil',   n: 'Filipino 菲律宾语',  s: 'fil-PH' },
  ];
  const QUICK = ['en', 'ja', 'ko', 'fr', 'de', 'es', 'ru', 'th'];
  const L = (c) => LANGS.find(x => x.c === c) || { c, n: c, s: c };
  const LNAME = (c) => c === 'auto' ? '自动检测' : L(c).n;

  /* ---------------- 视图状态 ---------------- */
  let from = 'auto', to = 'zh-CN';
  let srcText = '', outText = '', outPy = '', srcPy = '', detected = '';
  let busy = false, lastErr = '', rate = 1;
  let debounce = null;

  /* ---------------- 本地拼音（离线兜底） ---------------- */
  let pyLoading = false, pyQueue = [];
  function loadPinyin(cb) {
    if (window.KKX_PINYIN) return cb(true);
    if (pyLoading) { pyQueue.push(cb); return; }
    pyLoading = true;
    const sc = document.createElement('script');
    sc.src = 'js/pinyin-dict.js';
    sc.onload = () => { pyLoading = false; cb(true); pyQueue.forEach(f => f(true)); pyQueue = []; };
    sc.onerror = () => { pyLoading = false; cb(false); pyQueue.forEach(f => f(false)); pyQueue = []; };
    document.head.appendChild(sc);
  }
  function localPinyin(text) {
    const D = window.KKX_PINYIN;
    if (!D || !text) return '';
    if (!D._arr) D._arr = D.d.split(',');
    const out = [];
    let i = 0;
    while (i < text.length) {
      let hit = false;
      for (let len = 4; len >= 2; len--) {
        const seg = text.substr(i, len);
        if (D.p[seg]) { out.push(D.p[seg]); i += len; hit = true; break; }
      }
      if (hit) continue;
      const ch = text[i];
      const idx = ch.codePointAt(0) - D.start;
      if (idx >= 0 && idx < D._arr.length && D._arr[idx]) out.push(D._arr[idx]);
      else if (!/\s/.test(ch)) out.push(ch);
      i++;
    }
    return out.join(' ').replace(/\s+([，。、！？；：）】」』])/g, '$1');
  }

  /* ---------------- 翻译服务（多通道降级） ---------------- */
  function tryFetch(url, parse, timeout = 5500) {
    return new Promise((res, rej) => {
      const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => { ctl && ctl.abort(); rej(new Error('timeout')); }, timeout);
      fetch(url, ctl ? { signal: ctl.signal } : undefined)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(txt => { clearTimeout(timer); const v = parse(txt); if (!v || !v.text) throw new Error('empty'); res(v); })
        .catch(e => { clearTimeout(timer); rej(e); });
    });
  }

  const providers = [
    // 1) Google gtx —— 同时返回罗马音/拼音
    (q, sl, tl) => tryFetch(
      `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=rm&q=${encodeURIComponent(q)}`,
      (txt) => {
        const d = JSON.parse(txt);
        let text = '', tgtPy = '', sPy = '';
        (d[0] || []).forEach(seg => {
          if (seg[0]) text += seg[0];
          if (seg[2]) tgtPy += (tgtPy ? ' ' : '') + seg[2];
          if (seg[3]) sPy += (sPy ? ' ' : '') + seg[3];
        });
        return { text: text.trim(), tgtPy: tgtPy.trim(), srcPy: sPy.trim(), det: d[2] || '', via: 'Google' };
      }),
    // 2) Google dict-chrome-ex 备用端点
    (q, sl, tl) => tryFetch(
      `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=${sl}&tl=${tl}&q=${encodeURIComponent(q)}`,
      (txt) => {
        const d = JSON.parse(txt);
        let text = '';
        if (Array.isArray(d) && Array.isArray(d[0])) text = d[0].map(x => Array.isArray(x) ? x[0] : x).join('');
        else if (Array.isArray(d)) text = String(d[0] || '');
        else if (d && d.sentences) text = d.sentences.map(x => x.trans || '').join('');
        return { text: String(text).trim(), tgtPy: '', srcPy: '', det: (d && d[1]) || '', via: 'Google' };
      }),
    // 3) Lingva（开源 Google 代理，带发音）
    (q, sl, tl) => tryFetch(
      `https://lingva.ml/api/v1/${sl === 'auto' ? 'auto' : sl}/${tl}/${encodeURIComponent(q)}`,
      (txt) => {
        const d = JSON.parse(txt);
        const info = d.info || {};
        return { text: String(d.translation || '').trim(),
                 tgtPy: (info.pronunciation && info.pronunciation.translation) || '',
                 srcPy: (info.pronunciation && info.pronunciation.query) || '',
                 det: info.detectedSource || '', via: 'Lingva' };
      }),
    (q, sl, tl) => tryFetch(
      `https://lingva.garudalinux.org/api/v1/${sl === 'auto' ? 'auto' : sl}/${tl}/${encodeURIComponent(q)}`,
      (txt) => {
        const d = JSON.parse(txt);
        const info = d.info || {};
        return { text: String(d.translation || '').trim(),
                 tgtPy: (info.pronunciation && info.pronunciation.translation) || '',
                 srcPy: (info.pronunciation && info.pronunciation.query) || '',
                 det: info.detectedSource || '', via: 'Lingva' };
      }),
    // 4) MyMemory
    (q, sl, tl) => tryFetch(
      `https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${sl === 'auto' ? 'en' : sl}|${tl}`,
      (txt) => {
        const d = JSON.parse(txt);
        const t = (d.responseData && d.responseData.translatedText) || '';
        if (/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error('quota');
        return { text: String(t).trim(), tgtPy: '', srcPy: '', det: '', via: 'MyMemory' };
      }),
  ];

  /** 同一梯队内并发竞速，取第一个成功的结果 */
  function firstSuccess(makers, q, sl, tl) {
    return new Promise((resolve, reject) => {
      let pending = makers.length, lastErr = null, done = false;
      if (!pending) return reject(new Error('no provider'));
      makers.forEach(m => {
        let pr;
        try { pr = m(q, sl, tl); } catch (e) { pr = Promise.reject(e); }
        pr.then(r => {
          if (done) return;
          if (r && r.text) { done = true; resolve(r); return; }
          lastErr = new Error('empty');
          if (--pending === 0) reject(lastErr);
        }).catch(e => {
          if (done) return;
          lastErr = e;
          if (--pending === 0) reject(lastErr);
        });
      });
    });
  }

  /** 分梯队降级：梯队内并发，梯队间串行（最坏约 11 秒，通常 <1 秒） */
  async function translate(q, sl, tl, onStage) {
    const tiers = [
      [providers[0], providers[1]],   // Google 主/备
      [providers[2], providers[3], providers[4]], // Lingva 镜像 + MyMemory
    ];
    let err = null;
    for (let i = 0; i < tiers.length; i++) {
      if (onStage) onStage(i === 0 ? '翻译中…' : '主引擎超时，正在尝试备用引擎…');
      try { return await firstSuccess(tiers[i], q, sl, tl); }
      catch (e) { err = e; }
    }
    throw err || new Error('all failed');
  }

  /* ---------------- 语音朗读 ---------------- */
  let speaking = null;
  function speak(text, langCode, btn) {
    if (!('speechSynthesis' in window)) { K.toast('当前浏览器不支持语音朗读', 'info'); return; }
    const ss = window.speechSynthesis;
    if (speaking) { ss.cancel(); $$('.speak-btn').forEach(b => b.classList.remove('playing')); if (speaking === btn) { speaking = null; return; } }
    if (!text || !text.trim()) { K.toast('没有可朗读的内容', 'info'); return; }
    const u = new SpeechSynthesisUtterance(text);
    const target = L(langCode).s || 'zh-CN';
    u.lang = target;
    u.rate = rate;
    const vs = ss.getVoices() || [];
    const v = vs.find(x => x.lang && x.lang.toLowerCase() === target.toLowerCase())
           || vs.find(x => x.lang && x.lang.toLowerCase().startsWith(target.split('-')[0].toLowerCase()));
    if (v) u.voice = v;
    u.onend = u.onerror = () => { btn && btn.classList.remove('playing'); speaking = null; };
    speaking = btn || true;
    btn && btn.classList.add('playing');
    ss.speak(u);
  }
  if ('speechSynthesis' in window) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

  /* ---------------- 渲染 ---------------- */
  function render(host) {
    const s = K.state();
    if (s.translate.from) from = s.translate.from;
    const hist = s.translate.history || [];

    host.innerHTML = `
      <div class="stagger">
        <div class="card">
          ${K.cardHead('globe', '多语翻译', '支持 30+ 语种互译 · 自动生成拼音 / 罗马音读音',
            `<div class="flex aic gap6">
               <span class="fs11 faint">语速</span>
               <div class="seg" id="trRate">
                 ${[['0.7', '慢'], ['1', '正常'], ['1.3', '快']].map(([v, n]) =>
                   `<button data-rate="${v}" class="${+v === rate ? 'on' : ''}">${n}</button>`).join('')}
               </div>
             </div>`)}

          <div class="tr-panels">
            <!-- 源语言 -->
            <div class="tr-panel">
              <div class="tr-head">
                ${icon('mic')}
                <select class="select" id="trFrom">
                  <option value="auto" ${from === 'auto' ? 'selected' : ''}>自动检测</option>
                  ${LANGS.map(l => `<option value="${l.c}" ${from === l.c ? 'selected' : ''}>${esc(l.n)}</option>`).join('')}
                </select>
                <button class="icon-btn ghost tiny speak-btn" id="trSpeakSrc" title="朗读原文">${icon('volume')}</button>
              </div>
              <textarea class="tr-area" id="trIn" placeholder="输入或粘贴任意语言的文字…（Ctrl + Enter 立即翻译）" maxlength="1200">${esc(srcText)}</textarea>
              <div class="phonetic ${srcPy ? '' : 'hidden'}" id="trSrcPy">
                <span class="pk">读音</span><span id="trSrcPyText">${esc(srcPy)}</span>
              </div>
              <div class="tr-foot">
                <button class="btn xs" id="trClear">${icon('x')}清空</button>
                <button class="btn xs" id="trPaste">${icon('copy')}粘贴</button>
                <span class="tr-count"><span id="trCount">${srcText.length}</span>/1200</span>
              </div>
            </div>

            <!-- 交换 -->
            <div class="tr-swap">
              <button class="icon-btn" id="trSwap" title="交换语言方向">${icon('swap')}</button>
            </div>

            <!-- 目标语言 -->
            <div class="tr-panel out">
              <div class="tr-head">
                ${icon('globe')}
                <select class="select" id="trTo">
                  ${LANGS.map(l => `<option value="${l.c}" ${to === l.c ? 'selected' : ''}>${esc(l.n)}</option>`).join('')}
                </select>
                <button class="icon-btn ghost tiny speak-btn" id="trSpeakOut" title="朗读译文">${icon('volume')}</button>
              </div>
              <div class="tr-out ${outText ? '' : 'ph'}" id="trOut">${outText ? esc(outText) : '译文会显示在这里 ✦'}</div>
              <div class="phonetic ${outPy ? '' : 'hidden'}" id="trOutPy">
                <span class="pk">${to.startsWith('zh') ? '拼音' : '读音'}</span><span id="trOutPyText">${esc(outPy)}</span>
              </div>
              <div class="tr-foot">
                <button class="btn xs primary" id="trGo">${icon('play')}翻译</button>
                <button class="btn xs" id="trCopy">${icon('copy')}复制译文</button>
                <span class="tr-count" id="trStatus"></span>
              </div>
            </div>
          </div>

          <div class="flex aic jcb wrap gap10 mt14">
            <div class="lang-quick">
              <span class="fs11 faint fw6" style="align-self:center;margin-right:2px">快速切换：</span>
              ${QUICK.map(c => `<span class="chip ${from === c ? 'on' : ''}" data-quick="${c}">${esc(L(c).n.split(' ')[0])}</span>`).join('')}
              <span class="chip ${from === 'auto' ? 'on' : ''}" data-quick="auto">自动</span>
            </div>
            <span class="fs11 faint" id="trVia"></span>
          </div>
        </div>

        <div class="grid g-2 section-gap" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
          <div class="card">
            ${K.cardHead('clock', '翻译历史', hist.length ? `最近 ${hist.length} 条记录，点击可回填` : '还没有翻译记录',
              hist.length ? `<button class="btn xs danger" id="trClearHist">${icon('trash')}清空</button>` : '')}
            <div class="flex" style="flex-direction:column;gap:8px">
              ${hist.length ? hist.slice(0, 12).map((h, i) => `
                <div class="tr-hist-item" data-hist="${i}">
                  <div class="trh-src">${esc(LNAME(h.from))} → ${esc(LNAME(h.to))}　${esc(h.src.slice(0, 46))}${h.src.length > 46 ? '…' : ''}</div>
                  <div class="trh-out">${esc(h.out.slice(0, 60))}${h.out.length > 60 ? '…' : ''}</div>
                  ${h.py ? `<div class="fs11 faint mt6" style="letter-spacing:.3px">${esc(h.py.slice(0, 70))}</div>` : ''}
                </div>`).join('') : K.emptyBox('翻译过的内容会保存在这里 ✦', 'clock')}
            </div>
          </div>

          <div class="card">
            ${K.cardHead('info', '使用小贴士', '让读音更好用')}
            <div class="flex" style="flex-direction:column;gap:10px">
              ${[
                ['volume', '点击 🔊 图标可朗读原文或译文，语速可在右上角调整（依赖系统语音包）'],
                ['mic', '译文为中文时会自动标注拼音；其他语种显示罗马音'],
                ['zap', '快捷键：Ctrl / ⌘ + Enter 立即翻译；停止输入约 1 秒也会自动翻译'],
                ['globe', '联网时优先使用在线引擎；离线时中文拼音仍可本地生成'],
              ].map(([ic, t]) => `
                <div class="flex aic gap10" style="padding:10px 12px;border-radius:var(--r-md);
                  background:rgba(255,255,255,.55);border:1px solid var(--hairline)">
                  <span style="display:grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;
                    background:linear-gradient(145deg,#fff,var(--lav-100));color:var(--lav-600)">${icon(ic)}</span>
                  <span class="fs12 fw6" style="color:var(--ink-soft);line-height:1.55">${esc(t)}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;

    bind(host);
    if (lastErr) setStatus(host, lastErr, true);
  }

  function setStatus(host, msg, isErr) {
    const el = $('#trStatus', host);
    if (!el) return;
    el.textContent = msg || '';
    el.style.color = isErr ? 'var(--danger)' : 'var(--ink-faint)';
  }

  function paintOut(host) {
    const out = $('#trOut', host);
    out.textContent = outText || '译文会显示在这里 ✦';
    out.classList.toggle('ph', !outText);
    const pyBox = $('#trOutPy', host), pyT = $('#trOutPyText', host);
    pyBox.classList.toggle('hidden', !outPy);
    pyT.textContent = outPy || '';
    $('#trOutPy .pk', host).textContent = to.startsWith('zh') ? '拼音' : '读音';
    const sBox = $('#trSrcPy', host), sT = $('#trSrcPyText', host);
    sBox.classList.toggle('hidden', !srcPy);
    sT.textContent = srcPy || '';
  }

  async function run(host, silent) {
    const q = $('#trIn', host).value.trim();
    srcText = q;
    if (!q) { outText = ''; outPy = ''; srcPy = ''; paintOut(host); setStatus(host, ''); return; }
    if (busy) return;
    busy = true; lastErr = '';
    setStatus(host, '翻译中…');
    const go = $('#trGo', host);
    go.disabled = true; go.style.opacity = '.6';

    try {
      const r = await translate(q, from, to);
      outText = r.text;
      outPy = r.tgtPy || '';
      srcPy = r.srcPy || '';
      detected = r.det || '';
      // 目标为中文且未拿到拼音 → 本地生成
      if (!outPy && to.startsWith('zh')) {
        await new Promise(res => loadPinyin(() => res()));
        outPy = localPinyin(outText);
      }
      if (!srcPy && from !== 'auto' && from.startsWith('zh')) {
        await new Promise(res => loadPinyin(() => res()));
        srcPy = localPinyin(q);
      }
      paintOut(host);
      setStatus(host, `已完成${detected && from === 'auto' ? ` · 检测为 ${LNAME(detected)}` : ''}`);
      $('#trVia', host).textContent = `翻译引擎：${r.via}`;
      pushHistory(q, outText, outPy);
      if (!silent) K.toast('翻译完成 ✦', 'globe');
    } catch (e) {
      // 离线兜底：中文输入至少给出拼音
      let msg = '在线翻译服务不可用，请检查网络后重试';
      if (/[\u4e00-\u9fa5]/.test(q)) {
        await new Promise(res => loadPinyin(() => res()));
        srcPy = localPinyin(q);
        msg = '在线翻译失败，已离线标注拼音';
      }
      outText = ''; outPy = '';
      paintOut(host);
      lastErr = msg;
      setStatus(host, msg, true);
    } finally {
      busy = false;
      go.disabled = false; go.style.opacity = '';
    }
  }

  function pushHistory(src, out, py) {
    const s = K.state();
    s.translate.history = s.translate.history || [];
    const h = s.translate.history;
    if (h[0] && h[0].src === src && h[0].out === out) return;
    h.unshift({ src, out, py: py || '', from, to, ts: Date.now() });
    if (h.length > 30) h.length = 30;
    s.translate.from = from;
    K.save();
  }

  function bind(host) {
    const s = K.state();
    const inp = $('#trIn', host);

    $('#trGo', host).onclick = () => run(host);
    inp.addEventListener('input', () => {
      $('#trCount', host).textContent = inp.value.length;
      clearTimeout(debounce);
      const v = inp.value.trim();
      if (!v) { outText = ''; outPy = ''; srcPy = ''; paintOut(host); setStatus(host, ''); return; }
      debounce = setTimeout(() => run(host, true), 1000);
    });
    inp.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); clearTimeout(debounce); run(host); }
    });

    $('#trFrom', host).onchange = (e) => { from = e.target.value; s.translate.from = from; K.save(); K.render(); };
    $('#trTo', host).onchange = (e) => { to = e.target.value; if (inp.value.trim()) run(host, true); else paintOut(host); };

    $('#trSwap', host).onclick = (e) => {
      jitter(e.currentTarget);
      const prevFrom = from === 'auto' ? (detected || 'en') : from;
      from = to; to = prevFrom;
      const old = inp.value;
      srcText = outText || old;
      outText = ''; outPy = ''; srcPy = '';
      s.translate.from = from; K.save();
      K.render();
      const ni = $('#trIn', $(`.view[data-view="translate"]`));
      if (ni) { ni.value = srcText; if (srcText.trim()) run($(`.view[data-view="translate"]`), true); }
    };

    $('#trClear', host).onclick = (e) => {
      inp.value = ''; srcText = ''; outText = ''; outPy = ''; srcPy = '';
      $('#trCount', host).textContent = '0';
      paintOut(host); setStatus(host, ''); jitter(e.currentTarget); inp.focus();
    };
    $('#trPaste', host).onclick = async (e) => {
      jitter(e.currentTarget);
      try {
        const t = await navigator.clipboard.readText();
        if (t) { inp.value = t.slice(0, 1200); $('#trCount', host).textContent = inp.value.length; run(host, true); }
