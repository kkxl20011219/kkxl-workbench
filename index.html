      } catch (err) { K.toast('浏览器未授权读取剪贴板，请手动粘贴', 'info'); inp.focus(); }
    };
    $('#trCopy', host).onclick = async (e) => {
      if (!outText) { K.toast('还没有译文', 'info'); return; }
      jitter(e.currentTarget);
      try { await navigator.clipboard.writeText(outText + (outPy ? `\n${outPy}` : '')); K.toast('译文已复制', 'copy'); }
      catch (err) {
        const ta = document.createElement('textarea');
        ta.value = outText; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); K.toast('译文已复制', 'copy'); } catch (e2) { K.toast('复制失败', 'x'); }
        ta.remove();
      }
    };

    $('#trSpeakOut', host).onclick = (e) => speak(outText, to, e.currentTarget);
    $('#trSpeakSrc', host).onclick = (e) => speak(inp.value, from === 'auto' ? (detected || 'en') : from, e.currentTarget);

    on($('#trRate', host), 'click', '[data-rate]', (e, el) => {
      rate = +el.dataset.rate;
      $$('#trRate button', host).forEach(b => b.classList.toggle('on', b === el));
      K.toast('语速已设为 ' + el.textContent, 'volume');
    });

    on(host, 'click', '[data-quick]', (e, el) => {
      from = el.dataset.quick;
      s.translate.from = from; K.save();
      jitter(el);
      K.render();
      const v = $(`.view[data-view="translate"]`);
      const ni = $('#trIn', v);
      if (ni) { ni.value = srcText; if (srcText.trim()) run(v, true); }
    });

    on(host, 'click', '[data-hist]', (e, el) => {
      const h = (s.translate.history || [])[+el.dataset.hist];
      if (!h) return;
      from = h.from; to = h.to; srcText = h.src; outText = h.out; outPy = h.py || ''; srcPy = '';
      K.render();
      K.toast('已回填历史记录', 'refresh');
    });

    const ch = $('#trClearHist', host);
    if (ch) ch.onclick = () => {
      K.confirmBox('清空翻译历史', '将删除全部翻译历史记录，确定继续吗？', () => {
        s.translate.history = []; K.save(true); K.render(); K.toast('已清空', 'trash');
      }, '确认清空');
    };
  }

  K.registerView('translate', { render });
})(window.KKX);

</script>
<script>
/* inlined from js/views-calendar.js */
/* ============================================================
   周视图 · 一周全貌（排班 / 待办 / 学习 / 运动）
   年视图 · 全年活跃热力图 + 12 个月概览
   ============================================================ */
(function (K) {
  'use strict';
  const { $, $$, esc, icon, uid, on, jitter, fmtDate, addDays, startOfWeek, todayStr, WD_CN, MON_CN, SHIFTS } = K;

  /* =========================================================
     周视图
     ========================================================= */
  let wOffset = 0;

  function weekRender(host) {
    const s = K.state();
    const ws = addDays(startOfWeek(), wOffset * 7);
    const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
    const info = days.map(d => {
      const ds = fmtDate(d);
      const tasks = K.agg.tasksOn(ds);
      const subs = tasks.reduce((n, t) => n + (t.subs || []).length, 0);
      const subsDone = tasks.reduce((n, t) => n + (t.subs || []).filter(x => x.done).length, 0);
      const ex = K.agg.exerciseOn(ds);
      return {
        d, ds, tasks,
        done: tasks.filter(t => t.done).length,
        subs, subsDone,
        exMin: ex.reduce((n, e) => n + K.num(e.minutes), 0),
        exKcal: ex.reduce((n, e) => n + K.num(e.kcal), 0),
        stH: K.agg.studyHoursOn(ds),
        sc: s.schedule[ds] || null,
      };
    });

    const tTotal = info.reduce((n, x) => n + x.tasks.length, 0);
    const tDone = info.reduce((n, x) => n + x.done, 0);
    const stH = info.reduce((n, x) => n + x.stH, 0);
    const exMin = info.reduce((n, x) => n + x.exMin, 0);
    const otH = info.reduce((n, x) => n + (x.sc && x.sc.ot ? K.num(x.sc.otH) : 0), 0);
    const workD = info.filter(x => x.sc && SHIFTS[x.sc.shift] && SHIFTS[x.sc.shift].work).length;
    const pct = tTotal ? Math.round(tDone / tTotal * 100) : 0;
    const range = `${ws.getMonth() + 1}月${ws.getDate()}日 – ${days[6].getMonth() + 1}月${days[6].getDate()}日`;
    const label = wOffset === 0 ? '本周' : wOffset === -1 ? '上周' : wOffset === 1 ? '下周'
      : (wOffset < 0 ? `${-wOffset} 周前` : `${wOffset} 周后`);

    host.innerHTML = `
      <div class="stagger">
        <div class="grid g-4">
          ${K.statCard('checklist', tDone + '<small style="font-size:13px;color:var(--ink-faint)">/' + tTotal + '</small>', '', label + '事项完成',
            `<div style="flex:none">${K.ring(pct, { size: 52, sw: 5.5, color: 'var(--lav-500)' })}</div>`)}
          ${K.statCard('book', Math.round(stH * 10) / 10, 'h', '学习总时长')}
          ${K.statCard('pulse', exMin, 'min', '运动总时长')}
          ${K.statCard('calendar', workD, '天', otH ? `上班天数 · 加班 ${Math.round(otH * 10) / 10}h` : '上班天数')}
        </div>

        <div class="card section-gap">
          ${K.cardHead('weekView', `${label}全貌`, range,
            `<button class="icon-btn tiny" id="wvPrev" title="上一周">${icon('chevLeft')}</button>
             <button class="btn xs" id="wvNow">${icon('target')}回到本周</button>
             <button class="icon-btn tiny" id="wvNext" title="下一周">${icon('chevRight')}</button>`)}
          <div class="week-grid">
            ${info.map(x => wkCol(x)).join('')}
          </div>
          <p class="fs11 faint mt14">点击每列底部的 + 可为该天快速添加事项；勾选方框即可标记完成。</p>
        </div>

        <div class="grid g-2 section-gap">
          <div class="card">
            ${K.cardHead('trend', '每日完成事项', '包含主项与子项目')}
            ${K.bars(info.map(x => ({ label: WD_CN[x.d.getDay()].replace('周', ''), v: x.done + x.subsDone })),
              { unit: '项', hlIndex: info.findIndex(x => x.ds === todayStr()) })}
          </div>
          <div class="card">
            ${K.cardHead('layers', '一周节奏', '学习 / 运动 / 加班的时间分布')}
            <div id="wvMix"></div>
          </div>
        </div>
      </div>`;

    paintMix(host, info);
    weekBind(host);
  }

  function wkCol(x) {
    const sh = x.sc ? SHIFTS[x.sc.shift] : null;
    const today = x.ds === todayStr();
    const list = x.tasks.slice(0, 6);
    return `<div class="wk-col ${today ? 'is-today' : ''}" data-ds="${x.ds}">
      <div class="wk-head">
        <div>
          <div class="wk-wd">${WD_CN[x.d.getDay()]}</div>
          ${today ? '<span class="dc-today-tag">TODAY</span>' : ''}
        </div>
        <div class="wk-dt">${x.d.getDate()}</div>
      </div>
      ${sh ? `<span class="wk-shift" style="background:${sh.c}">${sh.label}${x.sc.ot && K.num(x.sc.otH) ? ` +${x.sc.otH}h` : ''}</span>`
           : `<span class="wk-shift" style="background:rgba(165,148,214,.2);color:var(--ink-muted)">未排班</span>`}
      <div class="wk-tasks">
        ${list.length ? list.map(t => {
          const q = K.QMAP[t.quad] || K.QUADS[0];
          return `<div class="wk-task ${t.done ? 'done' : ''}" title="${esc(t.text)}">
            <button class="check ${t.done ? 'on' : ''}" data-wcheck="${t.id}"
              style="width:13px;height:13px;border-radius:4px;border-width:1.5px;margin-top:1px">${icon('check')}</button>
            <span class="flex1" style="border-left:2px solid ${q.c};padding-left:5px">${esc(t.text.slice(0, 22))}${t.text.length > 22 ? '…' : ''}</span>
          </div>`;
        }).join('') : `<p class="fs11 faint" style="padding:6px 2px">暂无安排</p>`}
        ${x.tasks.length > 6 ? `<p class="fs11 faint" style="padding-left:2px">还有 ${x.tasks.length - 6} 项…</p>` : ''}
      </div>
      <div class="wk-metrics">
        <span class="wk-metric" title="学习时长">${icon('book')}${Math.round(x.stH * 10) / 10}h</span>
        <span class="wk-metric" title="运动时长">${icon('pulse')}${x.exMin}m</span>
        <button class="icon-btn ghost tiny" data-wadd="${x.ds}" title="为这天添加事项" style="margin-left:auto">${icon('plus')}</button>
      </div>
    </div>`;
  }

  function paintMix(host, info) {
    const box = $('#wvMix', host);
    if (!box) return;
    const rows = [
      { n: '学习时长', ic: 'book', c: '#9FB6E3', vals: info.map(x => x.stH), unit: 'h' },
      { n: '运动时长', ic: 'pulse', c: '#E9A0AE', vals: info.map(x => x.exMin / 60), unit: 'h' },
      { n: '加班时长', ic: 'zap', c: '#E6C08D', vals: info.map(x => (x.sc && x.sc.ot ? K.num(x.sc.otH) : 0)), unit: 'h' },
    ];
    const maxAll = Math.max(1, ...rows.flatMap(r => r.vals));
    box.innerHTML = rows.map(r => {
      const total = r.vals.reduce((a, b) => a + b, 0);
      return `<div style="margin-bottom:15px">
        <div class="flex aic jcb" style="margin-bottom:7px">
          <span class="flex aic gap6 fs12 fw6">
            <span style="display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:${r.c}22;color:${r.c}">${icon(r.ic)}</span>
            ${esc(r.n)}</span>
          <span class="fs11 fw7 tnum" style="color:${r.c}">${Math.round(total * 10) / 10}${r.unit}</span>
        </div>
        <div class="flex" style="gap:4px">
          ${r.vals.map((v, i) => `<div style="flex:1" title="${WD_CN[(i + 1) % 7]} ${Math.round(v * 10) / 10}${r.unit}">
            <div style="height:34px;display:flex;align-items:flex-end;background:rgba(165,148,214,.07);border-radius:5px;overflow:hidden">
              <div style="width:100%;height:${Math.max(v > 0 ? 8 : 0, Math.round(v / maxAll * 100))}%;
                background:linear-gradient(180deg,${r.c},${r.c}bb);border-radius:5px;transition:height .8s var(--ease-out)"></div>
            </div>
            <div class="fs11 faint" style="text-align:center;font-size:9px;margin-top:3px">${WD_CN[(i + 1) % 7].replace('周', '')}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('');
  }

  function weekBind(host) {
    $('#wvPrev', host).onclick = (e) => { wOffset--; jitter(e.currentTarget); K.render(); };
    $('#wvNext', host).onclick = (e) => { wOffset++; jitter(e.currentTarget); K.render(); };
    $('#wvNow', host).onclick = (e) => { wOffset = 0; jitter(e.currentTarget); K.render(); };

    on(host, 'click', '[data-wcheck]', (e, el) => {
      const t = K.state().tasks.find(x => x.id === el.dataset.wcheck);
      if (!t) return;
      t.done = !t.done;
      t.completedAt = t.done ? Date.now() : null;
      (t.subs || []).forEach(sb => {
        if (t.done && !sb.done) { sb.done = true; sb.completedAt = Date.now(); }
        if (!t.done && sb.done) { sb.done = false; sb.completedAt = null; }
      });
      el.classList.toggle('on', t.done);
      if (t.done) el.classList.add('burst');
      K.save(); K.updateBadges();
      setTimeout(() => K.render(), 260);
    });

    on(host, 'click', '[data-wadd]', (e, el) => {
      const ds = el.dataset.wadd;
      const s = K.state();
      jitter(el);
      K.openModal({
        title: `为 ${K.fmtMD(ds)} 添加事项`,
        okText: '添加',
        body: `<div class="field"><label>事项内容</label>
                 <input class="input" id="wvIn" placeholder="要做的事…" maxlength="80"></div>
               <div class="field"><label>所属象限</label>
                 <select class="select" id="wvQuad">
                   ${s.quadOrder.map(k => `<option value="${k}">${esc(K.QMAP[k].title)}</option>`).join('')}
                 </select></div>`,
        onOK(body) {
          const v = $('#wvIn', body).value.trim();
          if (!v) return false;
          s.tasks.push({ id: uid('tk'), date: ds, text: v, quad: $('#wvQuad', body).value,
                         done: false, createdAt: Date.now(), completedAt: null, subs: [] });
          K.save(true); K.render(); K.updateBadges();
          K.toast('已添加到 ' + K.fmtMD(ds), 'plus');
        },
      });
    });
  }

  K.registerView('week', { render: weekRender });

  /* =========================================================
     年视图
     ========================================================= */
  let year = new Date().getFullYear();

  function levelOf(score) {
    if (score <= 0.01) return 0;
    if (score < 2) return 1;
    if (score < 4.5) return 2;
    if (score < 8) return 3;
    return 4;
  }

  function yearRender(host) {
    const s = K.state();
    const jan1 = new Date(year, 0, 1);
    const dec31 = new Date(year, 11, 31);
    // 热力图起点：包含 1/1 的那一周的周一
    const gridStart = startOfWeek(jan1);
    const weeks = Math.ceil((dec31 - gridStart) / 864e5 / 7) + 1;

    // 年度统计
    const inYear = (ds) => ds.startsWith(String(year));
    const tasksY = s.tasks.filter(t => inYear(t.date));
    const doneY = tasksY.filter(t => t.done).length;
    const subsDoneY = s.tasks.reduce((n, t) => n + (t.subs || []).filter(x => x.done && x.completedAt && inYear(fmtDate(new Date(x.completedAt)))).length, 0);
    const exY = s.exercise.filter(e => inYear(e.date));
    const exMinY = exY.reduce((n, e) => n + K.num(e.minutes), 0);
    const exKcalY = exY.reduce((n, e) => n + K.num(e.kcal), 0);
    let stHY = 0;
    s.study.forEach(x => (x.logs || []).forEach(l => { if (inYear(l.date)) stHY += K.num(l.h); }));
    let otHY = 0, workY = 0;
    Object.entries(s.schedule).forEach(([ds, c]) => {
      if (!inYear(ds)) return;
      if (c.ot) otHY += K.num(c.otH);
      if (SHIFTS[c.shift] && SHIFTS[c.shift].work) workY++;
    });

    // 逐日分数
    const scores = {};
    let activeDays = 0, best = { ds: '', v: 0 };
    for (let d = new Date(jan1); d <= dec31; d = addDays(d, 1)) {
      const ds = fmtDate(d);
      const v = K.agg.scoreOn(ds);
      scores[ds] = v;
      if (v > 0.01) activeDays++;
      if (v > best.v) best = { ds, v };
    }
    const streak = maxStreak(scores, jan1, dec31);

    // 热力图列
    let cols = '', monthLabels = '';
    let lastMonth = -1;
    for (let w = 0; w < weeks; w++) {
      let cells = '';
      let labelThisWeek = '';
      for (let dow = 0; dow < 7; dow++) {
        const d = addDays(gridStart, w * 7 + dow);
        const ds = fmtDate(d);
        if (d.getFullYear() !== year) { cells += `<span class="heat-cell out"></span>`; continue; }
        if (dow === 0 && d.getMonth() !== lastMonth && d.getDate() <= 7) { lastMonth = d.getMonth(); labelThisWeek = MON_CN[d.getMonth()]; }
        const lv = levelOf(scores[ds] || 0);
        cells += `<span class="heat-cell ${lv ? 'l' + lv : ''} ${ds === todayStr() ? 'today' : ''}"
          data-day="${ds}" title="${d.getMonth() + 1}月${d.getDate()}日 · 活跃度 ${(scores[ds] || 0).toFixed(1)}"></span>`;
      }
      cols += `<div class="heat-week">${cells}</div>`;
      monthLabels += `<div class="heat-mlabel" style="width:12px;min-width:12px">${labelThisWeek ? `<span style="position:absolute;transform:translateX(-1px)">${labelThisWeek}</span>` : ''}</div>`;
    }

    host.innerHTML = `
      <div class="stagger">
        <div class="grid g-4">
          ${K.statCard('check', doneY + subsDoneY, '项', `${year} 年完成事项`)}
          ${K.statCard('book', Math.round(stHY * 10) / 10, 'h', '年度学习时长')}
          ${K.statCard('pulse', exY.length, '次', `运动 ${exMinY} min · ${exKcalY} kcal`)}
          ${K.statCard('flame', activeDays, '天', '年度活跃天数',
            `<div style="flex:none">${K.ring(Math.round(activeDays / 365 * 100), { size: 52, sw: 5.5, color: '#E9A0AE' })}</div>`)}
        </div>

        <div class="card section-gap">
          ${K.cardHead('yearView', `${year} 年活跃热力图`, `连续活跃最长 ${streak} 天${best.ds ? ` · 最活跃的一天是 ${K.fmtMD(best.ds)}` : ''}`,
            `<button class="icon-btn tiny" id="yPrev" title="上一年">${icon('chevLeft')}</button>
             <button class="btn xs" id="yNow">${icon('target')}今年</button>
             <button class="icon-btn tiny" id="yNext" title="下一年">${icon('chevRight')}</button>`)}
          <div class="heat-scroll">
            <div class="heat-months" style="position:relative;height:14px">${monthLabels}</div>
            <div class="heat">${cols}</div>
          </div>
          <div class="flex aic jcb wrap gap14 mt14">
            <p class="fs11 faint" style="max-width:520px;line-height:1.7">活跃度由「完成事项 + 子项目 + 学习时长 + 运动时长 + 是否上班」综合计算，颜色越深代表这一天越充实。</p>
            <div class="heat-legend">
              <span>少</span>
              ${[0, 1, 2, 3, 4].map(l => `<span class="heat-cell ${l ? 'l' + l : ''}"></span>`).join('')}
              <span>多</span>
            </div>
          </div>
        </div>

        <div class="card section-gap">
          ${K.cardHead('grid', '月度概览', '每个月的活跃分布与完成情况')}
          <div class="month-grid">
            ${Array.from({ length: 12 }, (_, m) => miniMonth(year, m, scores)).join('')}
          </div>
        </div>

        <div class="grid g-2 section-gap">
          <div class="card">
            ${K.cardHead('trend', '月度完成事项', '含主项与子项目')}
            ${K.bars(Array.from({ length: 12 }, (_, m) => ({
              label: (m + 1) + '月',
              v: monthDone(year, m),
            })), { unit: '项', hlIndex: year === new Date().getFullYear() ? new Date().getMonth() : -1 })}
          </div>
          <div class="card">
            ${K.cardHead('info', '年度小结', `${year} 年的坚持都记录在这里`)}
            <div class="flex" style="flex-direction:column;gap:10px">
              ${[
                ['check', `完成主项 ${doneY} 个、子项目 ${subsDoneY} 个`],
                ['book', `学习累计 ${Math.round(stHY * 10) / 10} 小时，平均每月 ${Math.round(stHY / 12 * 10) / 10} 小时`],
                ['pulse', `运动 ${exY.length} 次、${exMinY} 分钟，消耗约 ${exKcalY} kcal`],
                ['calendar', `上班 ${workY} 天，加班 ${Math.round(otHY * 10) / 10} 小时`],
                ['flame', `活跃 ${activeDays} 天，最长连续 ${streak} 天`],
              ].map(([ic, t]) => `
                <div class="flex aic gap10" style="padding:11px 13px;border-radius:var(--r-md);
                  background:rgba(255,255,255,.55);border:1px solid var(--hairline)">
                  <span style="display:grid;place-items:center;width:27px;height:27px;border-radius:8px;flex:none;
                    background:linear-gradient(145deg,#fff,var(--lav-100));color:var(--lav-600)">${icon(ic)}</span>
                  <span class="fs12 fw6" style="color:var(--ink-soft)">${esc(t)}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;

    yearBind(host);
  }

  function monthDone(y, m) {
    const s = K.state();
    const pre = `${y}-${K.pad(m + 1)}`;
    let n = s.tasks.filter(t => t.date.startsWith(pre) && t.done).length;
    s.tasks.forEach(t => (t.subs || []).forEach(x => {
      if (x.done && x.completedAt && fmtDate(new Date(x.completedAt)).startsWith(pre)) n++;
    }));
    return n;
  }

  function maxStreak(scores, from, to) {
    let cur = 0, best = 0;
    for (let d = new Date(from); d <= to; d = addDays(d, 1)) {
      if ((scores[fmtDate(d)] || 0) > 0.01) { cur++; best = Math.max(best, cur); }
      else cur = 0;
    }
    return best;
  }

  function miniMonth(y, m, scores) {
    const first = new Date(y, m, 1);
    const dim = new Date(y, m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    let cells = '';
    for (let i = 0; i < lead; i++) cells += `<span class="mm-day blank"></span>`;
    let act = 0;
    for (let d = 1; d <= dim; d++) {
      const ds = `${y}-${K.pad(m + 1)}-${K.pad(d)}`;
      const v = scores[ds] || 0;
      const lv = v <= 0.01 ? 0 : v < 3 ? 1 : v < 7 ? 2 : 3;
      if (v > 0.01) act++;
      cells += `<span class="mm-day ${lv ? 'act' + lv : ''} ${ds === todayStr() ? 'today' : ''}"
        title="${m + 1}月${d}日 · 活跃度 ${v.toFixed(1)}">${d}</span>`;
    }
    return `<div class="mini-month">
      <div class="mm-head">
        <span class="mm-name">${MON_CN[m]}</span>
        <span class="mm-stat">活跃 ${act} 天</span>
      </div>
      <div class="mm-days">
        ${['一', '二', '三', '四', '五', '六', '日'].map(w => `<span class="mm-wd">${w}</span>`).join('')}
        ${cells}
      </div>
    </div>`;
  }

  function yearBind(host) {
    $('#yPrev', host).onclick = (e) => { year--; jitter(e.currentTarget); K.render(); };
    $('#yNext', host).onclick = (e) => { year++; jitter(e.currentTarget); K.render(); };
    $('#yNow', host).onclick = (e) => { year = new Date().getFullYear(); jitter(e.currentTarget); K.render(); };

    on(host, 'click', '[data-day]', (e, el) => {
      const ds = el.dataset.day;
      const s = K.state();
      const tasks = K.agg.tasksOn(ds);
      const ex = K.agg.exerciseOn(ds);
      const stH = K.agg.studyHoursOn(ds);
      const sc = s.schedule[ds];
      const sh = sc ? SHIFTS[sc.shift] : null;
      const d = K.parseDate(ds);
      K.openModal({
        title: `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WD_CN[d.getDay()]}`,
        hideOK: true, cancelText: '关闭',
        body: `
          <div class="flex wrap gap6">
            ${sh ? `<span class="tag-static" style="background:${sh.c}22;color:${sh.c}">${icon('calendar')}${sh.label}${sc.ot && K.num(sc.otH) ? ` · 加班${sc.otH}h` : ''}</span>` : ''}
            <span class="tag-static">${icon('checklist')}事项 ${tasks.filter(t => t.done).length}/${tasks.length}</span>
            <span class="tag-static">${icon('book')}学习 ${Math.round(stH * 10) / 10}h</span>
            <span class="tag-static">${icon('pulse')}运动 ${ex.reduce((n, e2) => n + K.num(e2.minutes), 0)}min</span>
          </div>
          ${tasks.length ? `<div class="field"><label>当天事项</label><div class="todo-list">
            ${tasks.map(t => {
              const q = K.QMAP[t.quad] || K.QUADS[0];
              return `<div class="todo-item ${t.done ? 'done' : ''}" style="padding:8px 11px">
                <span class="q-dot" style="background:${q.c}"></span>
                <div class="ti-body"><div class="ti-text" style="font-size:12.5px">${esc(t.text)}</div></div>
                ${t.done ? `<span class="fs11 faint">${t.completedAt ? K.fmtTime(t.completedAt) : '已完成'}</span>` : ''}
              </div>`;
            }).join('')}</div></div>` : `<p class="fs12 faint">这一天没有事项记录。</p>`}
          ${ex.length ? `<div class="field"><label>运动记录</label><div class="flex wrap gap6">
            ${ex.map(e2 => `<span class="tag-static">${esc(e2.type)} ${K.num(e2.minutes)}min · ${K.num(e2.kcal)}kcal</span>`).join('')}
          </div></div>` : ''}`,
      });
    });
  }

  K.registerView('year', { render: yearRender });
})(window.KKX);

</script>

      console.log('%c可可熙李工作台 %cv' + window.KKX.version + ' · 数据保存在本浏览器本地',

          '<p class="fs12 muted">请刷新页面重试。若问题持续，可在浏览器控制台查看详情。</p></div>';
      }

  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
